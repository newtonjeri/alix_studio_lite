# =============================================================================
# alix_perception — node parameters
# =============================================================================
perception_node:
  ros__parameters:

    # ── Camera ───────────────────────────────────────────────────────
    image_topic: "/camera/camera/color/image_raw"
    camera_info_topic: "/camera/camera/color/camera_info"
    # Aligned depth: pixel (u,v) means the same thing in both images. Needs
    # align_depth.enable:=true on the real driver; Isaac's --camera publishes it
    # by rendering depth from the colour camera, so alignment there is exact.
    depth_image_topic: "/camera/camera/aligned_depth_to_color/image_raw"
    use_depth_image: true

    # ── Frames ───────────────────────────────────────────────────────
    # Output frame. Every cleaning config is expressed in it.
    target_frame: "alix_ref_frame"
    camera_frame: "camera_color_optical_frame"
    # Gravity-aligned frame the image ROLL is measured against. It must have
    # +Z up, which alix_ref_frame does not reliably have — it is parented to
    # R_Pole and rides the pole. Do not set this to the target frame.
    world_frame: "base_link"

    # ── Inference ────────────────────────────────────────────────────
    # Local is the default and the priority: models are developed in-house and a
    # customer washroom has no network guarantee. There is no fallback to a
    # cloud backend — a missing model is an error that says so.
    inference_backend: "local"

    # Path to the model manifest. EMPTY USES THE PACKAGED DEFAULT, which
    # declares both models ported from butterfli — so the node works with no
    # configuration. Their measured quality is poor (76 false positives over 13
    # clean images; see the manifest header) and that is a model problem to fix
    # by retraining, not a reason for the pipeline to refuse to run.
    # Set this, or export ALIX_PERCEPTION_MODELS, to use your own.
    models_manifest: ""

    # ── Fixture ──────────────────────────────────────────────────────
    # Which fixture model's regions.yaml defines the region vocabulary. Regions
    # are validated against it, so a detector cannot report a region this
    # fixture does not have or cannot be showing in the state it is in.
    fixture_type: "commode"
    fixture_model: "commode_c"

    # ── Gates ────────────────────────────────────────────────────────
    # State classification below this is reported but not acted on.
    confidence_threshold: 0.65

    # Smallest stain worth reporting, MILLIMETRES on the surface — not pixels.
    # This is the gate against the known false positive: the ~8-10 mm fiducial
    # dots on the test fixture. A pixel threshold cannot express a physical
    # size; this one survives a range, resolution or model change.
    min_stain_mm: 15.0

    # Range used when depth is missing or invalid at the sample point. 0.9 m is
    # the measured inspection-pose range to the bowl interior (0.892-1.032 m
    # over 8 field runs), not a guess.
    fallback_depth_m: 0.9

    # De-rotate the image by the measured camera roll before inference. The
    # camera is rigid to the wrist ROLL (R_joint7), so alix's inspection_pose_1
    # (the colour viewpoint, 2026-10-08) delivers the scene -87 degrees over and
    # the retired poses 1-3 sat at 64-106, while every reference image and every
    # model trained on upright crops assumes 0.
    # Detections are mapped back to original pixels before projection.
    derotate: true
    # What points UP after de-rotation, in world_frame: up (+Z) and away from
    # the robot toward the fixture (+X). Gravity alone is undefined when the
    # camera looks straight down (inspection_pose_4). [0, 0, 1] = gravity only.
    canonical_up_world: [1.0, 0.0, 1.0]
    # Regions from the fixture's own region meshes (core.region3d) with the
    # fixture pose from scene.yaml + TF, instead of region_bands.yaml.
    # ugv_standoff_m < 0 = the scene's default standoff.
    # The depth decides the state only at these named poses (the arm's joint
    # states matched to the MoveIt group states); elsewhere colour decides.
    # [''] = at any pose where depth and TF exist (Newton, 2026-10-08 evening: both
    # instruments answer everywhere); [inspection_pose_4] restores the pose-4 gate.
    depth_state_poses: ['']
    depth_state_pose_tolerance_rad: 0.1
    # The real fixture's calibration (core config/fixtures/<model>_calibration.yaml): auto =
    # the measured file on the robot, NONE under simulated time (`use_sim_time`, forwarded
    # by the Isaac bringup; the simulator's fixture is the model); none; or a path.
    fixture_calibration: auto
    # Learn the session's registration (how much higher the real fixture sits than its
    # nominal pose, per named pose) from confident closed decisions and apply it to the
    # frames that follow: the depth then decides the open states at pose 4 as well.
    depth_registration_learn: true
    # The state policy: depth and colour both answer; agreement = the state, surer than
    # either; one alone = that one; disagreement = no state ("uncertain"), re-checked by
    # the executive from another pole height. false = the depth overrides the colour.
    state_fusion: true
    joint_states_topic: /joint_states
    route_by_mesh: true
    fixture_scene_yaml: ""
    fixture_venue_yaml: ""     # "" = the default washroom venue (its yaw turns the fixture to face the robot)
    ugv_standoff_m: -1.0

    tf_timeout_s: 2.0

    # ── Inference cost ───────────────────────────────────────────────
    # Downscale the frame before inference; 0 = off, use the native resolution.
    # The colour stream is 1920x1080 and both shipped models were trained at
    # 640, so this is the one parameter that changes response time materially
    # (inference cost is roughly pixel count). The INTRINSICS are scaled with
    # the image, so 3D positions are unaffected — resizing one without the other
    # is the classic way to produce positions wrong by the scale factor that
    # look entirely plausible. 640 is a sensible value; measure before setting.
    inference_max_width: 0

    # ── Frame traceability ───────────────────────────────────────────
    # Write the frame that was analysed, and the annotated version showing what
    # was found, rejected and deliberately left. OFF by default: this writes on
    # every request, and a robot cleaning all day fills a disk.
    #
    # Turn them on during development, during a field trial, and whenever a
    # result is disputed. The 294-frame `used_frames` corpus that butterfli
    # accumulated is the only labelled data either workspace has, and it exists
    # only because the equivalent switch was on.
    #
    # `create_new_file` in the AnalyzeScene request decides the filename:
    # false overwrites <mode>_latest.png, true writes a timestamped capture.
    save_frames: false
    save_annotated: false
    # Empty = Resource/captures/<date>/. Deliberately NOT Resource/Data, which
    # holds the labelled evaluation corpus — dropping live frames in there would
    # contaminate the data the model scores are measured against.
    capture_dir: ""
    save_check_frames: true              # Newton 2026-10-07: every gap_check / status_check keeps the frame it decided on,
                                        # with the decision: <capture_dir>/checks/<stamp>_<mode>_<expect>_<class>.json + _depth.npy
                                        # + _depth.png (ROIs drawn) + _color.png; capture_dir empty = Resource/captures/<date>/

    # How long to wait for a camera frame before refusing the request. This
    # replaces butterfli's retry-the-whole-analysis-twice-with-a-2 s-sleep,
    # which was built for a flaky network call to Gemini: local inference is
    # deterministic, so re-running it on the same array gives the same answer
    # and the same exception. A frame that has not arrived yet is the one
    # transient failure on this path, so it is the one thing worth waiting on.
    frame_wait_s: 2.0
    # A frame is used only if it arrived within this of the request: the frame the
    # executive asked for is the one at its pose, not the last one the stream produced
    # before it stalled (hardware 2026-10-09: a 56-165 s old colour frame of the commode
    # side was recorded for every check of two runs). A stale depth refuses the check.
    frame_max_age_s: 0.5
    # Lift check (P20, 2026-10-05): mode 'gap_check' — geometry from depth, no model.
    # The central ROI of the depth frame is deprojected into world_frame and its
    # median height compared with the part's CLOSED top; lifted iff gap_lift_m
    # higher. commode_c in base_link: lid top 0.45 m, seat top 0.44 m (P20 probe).
    # Isaac, inspection_pose_4 at pole half: closed 0.45 m, lifted to -30 deg 0.61 m.
    # The closed lid read within this of the nominal top (no opening, no standing lid) IS
    # closed and teaches the session's placement: its offset becomes the registration at
    # that pose and every later lid/seat top carries it (hardware 2026-10-09: +21 mm, which
    # the 20 mm closed tolerance alone had refused as "between").
    gap_register_m: 0.04
    # The seat learns its OWN placement from a well-populated ring reading (band >= this
    # fraction of the ROI) that lies within gap_seat_register_tol_m of the lid's offset; the
    # lid's offset alone put the seat top 7 mm too high on the robot (2026-10-10).
    gap_seat_register_min_band: 0.15
    gap_seat_register_tol_m: 0.012
    # A band thinner than this may call the seat ABSENT only at two absent-margins below the top.
    gap_seat_absent_min_band: 0.10
    # A ring this far below the registered seat top is still a fully confident closed ring.
    gap_seat_closed_tol_m: 0.006
    gap_lid_top_z: 0.45
    gap_seat_top_z: 0.44
    gap_lift_m: 0.05
    gap_roi: [0.40, 0.60, 0.40, 0.60]   # rows r0 r1, cols c0 c1, fractions of the frame
    gap_depth_source: "depth"           # "depth" = the wrist D435's native depth stream + its camera_info and optical
                                        # frame (default); "aligned" = the depth aligned to colour (depended on the colour
                                        # camera; carried no valid pixel on the Isaac bringup of 2026-10-05 16:21)
    gap_seat_roi: [0.58, 0.78, 0.30, 0.70]  # the seat is a RING and the centre looks through its opening: the ROI is the FRONT ring
                                        # region from inspection_pose_4, which a lid held at -30 never covers
    gap_seat_absent_m: 0.012             # seat_lifted also when the ring is ABSENT from its closed place (the bowl rim, 17-22 mm
    gap_lid_closed_tol_m: 0.02           # lid_closed when the centre ROI's median is within this of the closed top (0.447 measured)
    gap_lid_open_m: 0.05                 # lid_open when it is this far BELOW the top: the lid is absent and the bowl shows (0.274 at -110)
    gap_lid_wide_roi: [0.30, 0.75, 0.30, 0.70]  # lid open/closed is structural (hardware 2026-10-07: the centre ROI read the closed SEAT as a closed lid):
    gap_lid_deep_m: 0.10                 #   open when >= gap_lid_hole_min of the wide ROI lies this far below the top (the seat opening / bowl shows)
    gap_lid_hole_min: 0.08               #   ... or when the lid stands near the camera in the top rows (range < gap_lid_standing_range_m)
    gap_lid_top_rows: 0.35
    gap_lid_standing_range_m: 0.35
    gap_lid_standing_min: 0.10           #   closed = centre median within gap_lid_closed_tol_m of the top AND no opening visible
    # The 'bowl shows' cue counts pixels at least gap_lid_deep_m below the lid top AND above
    # this height: the floor beyond the lid's far edge is not the bowl (2026-10-08: a closed
    # lid was called open on floor pixels).
    gap_lid_bowl_floor_m: 0.12
    # A rise between gap_lift_m and this is 'lifted' whatever the top rows show: the
    # standing-lid cue also fires for a lid at -30 deg (2026-10-08: a 148 mm lift failed).
    gap_lid_lifted_max_m: 0.30
    # Cross-check a closed/open gap class with the fused state (colour + registered depth):
    # a confident contradiction answers 'uncertain', which proves nothing (fail-closed).
    gap_cross_check: true
                                        # below the seat top, shows instead): the seat went up with the lid
    gap_seat_band_z: [0.38, 0.47]        # heights (m, world_frame) that are ring (0.44) or rim (0.42); a lid held at -30 and the
                                        # lifting hand sit at 0.55-0.79 m in this ROI and are excluded by the band itself
    gap_seat_min_band: 0.03              # refuse when less of the ROI lies in the band after masking the hands (6 % with the lid held at -30)
    gap_hand_mask_m: 0.14                # points within this radius of a hand frame are not the seat (the lifting fingers hover at 0.6-0.8 m)
    gap_hand_frames: ["ILH_plam", "ILH_left_index_1", "ILH_left_index_tip", "ILH_left_middle_1", "ILH_left_middle_tip",
                      "ILH_left_ring_1", "ILH_left_ring_tip", "ILH_left_little_1", "ILH_left_little_tip",
                      "ILH_left_thumb_1", "ILH_left_thumb_tip", "IRH_plam", "IRH_right_index_tip",
                      "IRH_right_middle_tip", "IRH_right_ring_tip", "IRH_right_little_tip", "IRH_right_thumb_tip"]
    # THE SEAT AGAINST ITS OWN CLOSED FRAME (Newton 2026-10-23; core seat_rise.py, the evidence in
    # Resource/reports/2026-10-23_seat_check_occlusion). On the robot the left hand that lifts the seat
    # fills gap_seat_roi: all four seat_open runs of 22-23 Oct answered "refused" with the seat lifted
    # and a false re-lift followed. The camera does not move between verify_seat_closed and
    # verify_seat_lifted, so the ring near the hinge is compared pixel by pixel with the closed frame.
    # A band refusal now says "cannot judge" and consults this reading; band and comparison agreeing
    # keep the class, a conflict answers "uncertain" (no vote).
    gap_seat_rise_enabled: true          # false = the band reading alone, as before
    gap_seat_rise_region_m: [0.03, 0.15] # the decision region: ring pixels this far from the hinge (fixture frame), where
                                        # the lifting hand never is (10 Oct 19:09: a glove over the seat FRONT, 0-1 % rose here)
    gap_seat_rise_hand_m: 0.10           # a pixel that rose more than this is a hand or an arm, not the seat
    gap_seat_rise_min_px: 1500           # usable pixels needed for any answer (8-20k measured at pose 4)
    gap_seat_rise_closed_m: 0.004        # closed: >= gap_seat_rise_closed_frac of the pixels within this of the closed frame
    gap_seat_rise_closed_frac: 0.85      #   (two closed frames compared: 91-98 % within 4 mm)
    gap_seat_rise_moved_m: 0.008         # lifted: >= gap_seat_rise_moved_frac of the pixels moved by this (the 4 runs: 100 %) ...
    gap_seat_rise_moved_frac: 0.60
    gap_seat_lift_min_deg: 10.0          # ... AND a robust hinge fit of at least this (Newton 2026-10-23: 10 deg; the 4 runs 29-37) ...
    gap_seat_rise_hinge_tol_m: 0.04      # ... about a hinge this close to the model's (fitted 1-6 mm from it) ...
    gap_seat_rise_down_frac: 0.60        # ... OR this share moved DOWN (the rim shows where the ring was)
    gap_seat_rise_hinge: [0.890, 0.0, 0.440]  # the hinge in world_frame when there are no fixture meshes (the model's, default standoff)
    gap_seat_ref_box: [0.48, 0.90, -0.18, 0.18]  # the seat footprint (x0 x1 y0 y1, world_frame) when there are no fixture meshes
    gap_seat_ref_frames: 5               # the reference = the per-pixel median of up to this many seat_closed frames
    gap_seat_ref_ring_m: 0.015           # ring pixels: within this of the registered seat top in the closed frame ...
    gap_seat_ref_margin_m: 0.015         # ... inside the seat's footprint (its mesh cells, closed) grown by this
                                        # NO camera-pose tolerance (Newton 2026-10-23: position or view point never decides the
                                        # class): the reference is world points projected into whichever camera asks; only how
                                        # much of the ring near the hinge it sees limits an answer (the glove / left arm occlude)
    gap_seat_ref_max_age_s: 900.0        # the reference is used at most this long after its newest closed frame
    gap_seat_ref_lid_z: 0.55             # THE LID GUARD: the open lid's points (above this in the closed frame); along the asking
    gap_seat_ref_lid_m: 0.010            #   camera's rays, farther than before = the lid left, nearer = occluded (not counted).
    gap_seat_ref_lid_frac: 0.80          #   Fewer than this share of the seen points within gap_seat_ref_lid_m refuses the reference:
                                        #   a lid lifted to -30 turns on the seat's hinge and mimics a lifted seat (10 Oct 17:38 ->
                                        #   17:41: 43 %; the seat runs 98-100 %)
    gap_seat_ref_lid_min_px: 1500        # the open lid counts as seen with this many unoccluded points (11-17k measured); unseen,
                                        # only a lift by the hinge fit is withheld (the closed and rim readings cannot be faked by it)
    gap_seat_ref_replace_m: 0.006        # a closed frame this far (median, on the ring) from the reference replaces it
    # THE SEAT'S STATE FROM THE FRAME ITSELF (core seat_state.py; Newton 2026-10-23: the band reading "is a shallow
    # check that does not check what I want"): the fixture model is rendered into this camera with the seat (and the
    # lid) at every candidate hinge angle — seat d with the lid open, seat and lid together, the lid alone with the
    # seat down — and the measured depth, the hands left out, says which: pixels explained minus pixels the camera
    # sees PAST. No earlier frame, any viewpoint. It answers the seat question; the band reading and the closed-frame
    # comparison cross-check it (a confident contradiction -> uncertain). Recorded seat questions: the four seat_open
    # runs 30-35 deg (margin +0.34..+0.40), every closed seat 0 (-0.52..-1.07), an open seat 110.
    gap_seat_fit_enabled: true
    gap_seat_fit_stride: 3               # render and compare at 1/3 resolution (about 0.2 s a frame)
    gap_seat_fit_step_deg: 5.0           # candidate hinge angles from closed to open
    gap_seat_fit_tol_m: 0.015            # a pixel within this of a hypothesis's surface is explained by it
    gap_seat_fit_min_px: 1000            # pixels (at 1/stride) where the angle shows, needed for an answer (8-24k measured)
    gap_seat_fit_margin: 0.20            # the best lifted vs the best seat-down hypothesis (relative); inside it, no answer
    # THE LID FROM THE SAME FIT (2026-10-24, Resource/reports/2026-10-24_fixture_state): one fit over the whole fixture
    # answers the lid too (the centre ROI is 20 % x 20 % of the frame; a glove over it blinds it as it did the seat).
    # Closed against not closed decides, then the better of lifted and open names it; a confident ROI reading on the
    # other side -> uncertain. The stride, step, tolerance, pixels and margin above serve both parts.
    gap_lid_fit_enabled: true
    gap_lid_fit_min_deg: 10.0            # the lid lifted from 10 deg (the seat's rule; the 50 mm bar is ~6.5 deg at its front)
    gap_lid_fit_open_min_deg: 80.0       # open (standing) from 80 deg; between: lifted
    gap_fit_height_search_m: 0.010       # each hypothesis at its own best height within this of the registration
    gap_fit_height_step_m: 0.005         # (the simulator's commode sat 9 mm below the calibrated model: a closed lid read open)
                                        # (a lid at -30 hides the seat under it: "did it come along?" stays inside here)
    # THE CLOSING ALLOWANCE (the owner, 2026-10-30): a closing's outcome check (Close the seat's seat_closed, Close the
    # lid's lid_closed) counts the part within this angle of closed as closed; the camera may look while a soft-close
    # seat is still settling (30 Oct 15:36: 20, 15, 10, 10, 10 deg over 1.4 s, five frames uncertain). Only the angle
    # readings widen (GapCheckSession.check `closed_within_deg`); a ring or lid gone from its place (the rim, the bowl
    # shows) is never closed, and every other question keeps the 10 deg rule. The caller passes it for that check only
    # (Studio Lite's runner; the AnalyzeScene request has no field to say which check asks, so this node does not).
    gap_closing_max_deg: 25.0
