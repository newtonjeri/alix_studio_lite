# joint_limits.yaml allows the dynamics properties specified in the URDF to be overwritten or augmented as needed
#
# ARM max_jerk = 1500 rad/s^3 — MEASURED CEILING (2026-07-31, hardware, toplid task).
# Previously 1000.0, which was a round placeholder never validated against hardware.
# Determined by executing the same cleaning stroke at four ceilings and judging
# smoothness AND path fidelity on the real arm:
#
#   ceiling  accel cap  duration  |a| railed  result
#   300      10.472     15.7 s     9.8 %      chatters (jerk too low to finish a jerk phase)
#   1000      4.313     22.2 s     0.0 %      smooth; measured a_rms -44 % vs baseline
#   1500      6.470     18.2 s     0.0 %      smooth, NO path deviation  <-- chosen
#   2000      8.634     15.8 s     0.0 %      path deviation appears
#   2471     10.472     14.4 s    23.0 %      deviation + harsh
#
# Above ~1500 the arm can no longer TRACK the commanded profile: the plan stays
# accurate (between-via EEF deviation is 0.40 mm max) but the servo lags, so the
# EXECUTED path leaves the surface. For a cleaning stroke that is the binding
# requirement, not smoothness. See Documentation/ruckig_pro_review.md.
#
# NOTE: this interacts with max_acceleration. cleaning_tasks couples them
# (jerk_coupling: auto) as j >= 2*a/dt_section, capping acceleration when the
# ceiling cannot supply the jerk. Raising one without the other reintroduces the
# inconsistency that caused the original chatter.

# ARM max_velocity comes from the ROBOT DESCRIPTION, not from a hand-typed
# rounding. Until 2026-08-27 these read 3.14 and 3.92 rad/s — 179.909 and
# 224.600 deg/s against the vendor's 180 and 225 (RM75 Ontology Parameters),
# which is also what rm_75_macro.xacro now states exactly. The values below are
# pi and 225*pi/180 to full double precision.
# tools/kinematics/check_kinematics_sources.py compares them against the URDF on every
# run of tools/run_tests.sh; edit the XACRO, then re-run that checker.
#
# For beginners, we downscale velocity and acceleration limits.
# You can always specify higher scaling factors (<= 1.0) in your motion requests.  # Increase the values below to 1.0 to always move at maximum speed.
default_velocity_scaling_factor: 0.1
default_acceleration_scaling_factor: 0.1

