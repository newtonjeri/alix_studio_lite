# =============================================================================
# SRDF GROUP STATES — COMPLETE ARMS  (SOURCE OF TRUTH)
# =============================================================================
# complete_{right,left}_arm states (pole slider + 7-DOF RM75 + inspire hand
# as ONE group), so a single move_to_state plans pole height, arm posture
# and hand aperture together as one collision-checked trajectory.
# The plain alix.srdf is ASSEMBLED from these fragment files by
#   python3 Resource/scripts/sync_srdf_group_states.py
# (the test suite runs it in check mode — edit HERE, never in the .srdf).
#
# Values are BORROWED from arms/poles/hands_group_states.yaml — keep them in
# sync when recalibrating there:
#   ready      -> arm ready     + pole full (0.30) + hand release
#   *_min_pole -> same arm/hand + pole minimum (0.01)
#   rest_pose  -> arm rest_pose + pole full (0.30) + hand grasp
#   zero_pose  -> arm zero_pose + pole full (0.30) + hand release
# =============================================================================

