      group: rm75_arm_right
      R_joint1: -0.5668
      R_joint2: -0.1814
      R_joint3: -2.2644
      R_joint4: 1.6401
      R_joint5: -0.2445
      R_joint6: 1.5378
      R_joint7: 3.4559

    # After Any of the Dispense (or after Dispense_Via)
    # -33, -8, -131, 65, -12, 109, 17
