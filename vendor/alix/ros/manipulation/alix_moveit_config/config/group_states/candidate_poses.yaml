      group: rm75_arm_right
      R_joint1: -0.5707
      R_joint2: -0.1429
      R_joint3: -2.2789
      R_joint4: 1.1357
      R_joint5: -0.2178
      R_joint6: 1.903
      R_joint7: 0.3043

    # from final1, after this pose we move to ready/rest pose
