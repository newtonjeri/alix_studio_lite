# =============================================================================
# CANDIDATE POSES — SCRATCH PAD, **NOT** PART OF THE SRDF
# =============================================================================
# Poses under review. Edit this file freely, then look at them:
#
#   python3 alix_moveit_config/scripts/preview_joint_states.py            # all of them
#   python3 alix_moveit_config/scripts/preview_joint_states.py --cycle 3  # step through
#   python3 .../preview_joint_states.py --candidate glove_approach_1           # just one
#
# In RViz:  Add -> RobotState,  Robot State Topic = /preview_robot_state
# (set Robot Alpha ~0.6 to see the candidate against the live robot).
# Nothing here is published to /joint_states, so the running robot is untouched.
#
# WHY THIS FILE IS SAFE
# ---------------------
# It is deliberately NOT named *_group_states.yaml, so the two tools that
# assemble the robot description skip it by construction:
#   Resource/scripts/sync_srdf_group_states.py      (SRDF assembler)
#   alix_moveit_config/scripts/mirror_group_states.py  (L<->R mirror)
# The assembler also names it in an explicit ignore-list, so the exclusion is
# documented rather than accidental. A pose only reaches the robot when you
# copy it into a real *_group_states.yaml fragment and re-run the assembler.
#
# FORMAT
# ------
#   <pose name>:
#     group: <planning group>        # so the validity check knows what to test
#     <joint>: <radians>             # every joint of that group
#
# Values are RADIANS. Degrees are in the trailing comment for readability.
# =============================================================================

candidate_poses:
    # -10, -92, -84, 85, -10, 105, 3
    glove_wear_entry_via:
      group: rm75_arm_right
      R_joint1: -0.1702
      R_joint2: -1.6048
      R_joint3: -1.4624
      R_joint4: 1.4769
      R_joint5: -0.1786
      R_joint6: 1.8291
      R_joint7: 0.0483 
      
    # -23, -24, -119, 47, -34, 114, 18
