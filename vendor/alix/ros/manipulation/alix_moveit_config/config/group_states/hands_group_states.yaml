      IRH_right_ring_1_joint: 1.3
      IRH_right_thumb_1_joint: 0.0698
      IRH_right_thumb_2_joint: 0.454
    thumb_grasp:
      IRH_right_index_1_joint: 0.01
      IRH_right_little_1_joint: 0.01
      IRH_right_middle_1_joint: 0.01
      IRH_right_ring_1_joint: 0.01
      IRH_right_thumb_1_joint: 0.0698
      IRH_right_thumb_2_joint: 0.454
    quarter_grasp:
      IRH_right_index_1_joint: 0.336
      IRH_right_little_1_joint: 0.336
      IRH_right_middle_1_joint: 0.336
      IRH_right_ring_1_joint: 0.336
      IRH_right_thumb_1_joint: 0.0
      IRH_right_thumb_2_joint: 0.454
    # Pointing (flush press): index FULLY open (release value), other digits
    # folded. The press IK frame is R/L_index_tip_frame — a FIXED frame at the
    # full-open tip position (ik_frames.xacro) — so the physical finger must be
    # fully extended to coincide with it. (MoveIt renders the index_2 mimic at
    # its unclamped -0.175 here; physics/hardware hard-stop it at 0 — display
    # only, planning never uses the finger joints.)
    pointing:
      IRH_right_index_1_joint: 0.01
      IRH_right_little_1_joint: 1.3
      IRH_right_middle_1_joint: 1.3
      IRH_right_ring_1_joint: 1.3
      IRH_right_thumb_1_joint: 0.0698
      IRH_right_thumb_2_joint: 0.454

