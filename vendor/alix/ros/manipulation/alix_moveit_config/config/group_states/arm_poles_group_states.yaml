# =============================================================================
# SRDF GROUP STATES — ARM+POLE  (SOURCE OF TRUTH)
# =============================================================================
# Combined arm_pole_{right,left} states (pole slider + 7-DOF RM75 as ONE
# group), so a single move_to_state plans the pole height and arm posture
# together as one collision-checked trajectory.
# The plain alix.srdf is ASSEMBLED from these fragment files by
#   python3 Resource/scripts/sync_srdf_group_states.py
# (the test suite runs it in check mode — edit HERE, never in the .srdf).
#
# Values are BORROWED from arms_group_states.yaml / poles_group_states.yaml —
# keep them in sync when recalibrating there. Each state names the pole_right
# height it is paired with, so the combined entry and the standalone
# arm + pole stages always agree:
#   glove-wear waypoints -> arm state + pole full_length / three_quarter_length
#   glove_remove         -> arm glove_remove      + pole quarter_length
#   inspection poses     -> arm inspection_pose_1/4 + pole half_length (the twin's ONE
#                           height; the inspection node runs at ANY principal height)
# =============================================================================

group_states:
  arm_pole_right:
    # =======================================================================
    # GLOVE WEAR — HAND-TAUGHT WAYPOINTS (combined-group twins)
    # =======================================================================
    # Arm values copied verbatim from rm75_arm_right (see the taught block in
    # arms_group_states.yaml for provenance, tip poses and clearances); the pole
    # is the NAMED pole_right height the pose was taught at, so the standalone
    # arm stage and the standalone pole stage agree with this combined state.
    #
    # The glove-wear TASK drives these through the SEPARATE rm75_arm_right and
    # pole_right groups. These entries exist only so the combined group stays
    # coherent for anything that plans arm+pole as one.
    # =======================================================================

