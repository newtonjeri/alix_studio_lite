# =============================================================================
# controllers_real.yaml — REAL-HARDWARE controller set
# =============================================================================
# Same layout as controllers.yaml (sim) with ONE deliberate divergence:
# pole and hand run alix_hw/ProfiledPositionController instead of the
# JTC, because the real devices are PROFILED positioners (onboard motion
# profile that restarts on every command — hardware-verified 2026-07-11:
# retargeting produces stepwise motion). Arms keep the JTC: the RM75
# passthrough stream is a true servo interface (bench: ~0.1 deg tracking).
# Simulation keeps controllers.yaml unchanged (gz joints are servo axes).
# =============================================================================
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    left_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    right_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    left_hand_controller:
      type: alix_hw/ProfiledPositionController

    right_hand_controller:
      type: alix_hw/ProfiledPositionController

    left_pole_controller:
      type: alix_hw/ProfiledPositionController

    right_pole_controller:
      type: alix_hw/ProfiledPositionController

    # Track replay (DRIVER_EXECUTION_CONTRACTS.md §4): claims the same 7 arm
    # position interfaces as the JTC, so controller_manager makes the two
    # mutually exclusive — activate one, deactivate the other. Loaded
    # INACTIVE; the executive switches per track group.
    # No longer production (CANFD_PRODUCTION_DRIVER.md §7): the bringup
    # spawns these only with with_upload_replay:=true, until the separation
    # pass (§8) moves the upload lane out of ros2_control.
    left_track_replay_controller:
      type: alix_hw/TrackReplayController

    right_track_replay_controller:
      type: alix_hw/TrackReplayController

    # THE PRODUCTION STROKE (CANFD_PRODUCTION_DRIVER.md §5): one pinned dense
    # track per ~/stream_track goal on the CANFD pass-through, host-timed by
    # the hardware's stroke channel. Same exclusivity as above (the 7 arm
    # positions + the <P>_stroke gpio); loaded INACTIVE, per canfd side, once
    # that side's JTC is up; the executive switches JTC -> this and back.
    left_track_stream_controller:
      type: alix_hw/TrackStreamController

    right_track_stream_controller:
      type: alix_hw/TrackStreamController

    ugv_steering_controller:
      type: position_controllers/JointGroupPositionController

    ugv_driving_controller:
      type: velocity_controllers/JointGroupVelocityController


left_arm_controller:
  ros__parameters:
    joints:
      - L_joint1
      - L_joint2
      - L_joint3
      - L_joint4
      - L_joint5
      - L_joint6
      - L_joint7
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    # REAL-HARDWARE tolerances: path (trajectory) tolerance is DISABLED —
    # cleaning is contact-rich, and surface drag makes tracking error grow as
    # a matter of physics, not fault (field finding 2026-07-12: 0.20 rad
    # aborted valid wipes). The goal check remains: a genuinely stuck arm
    # still fails at trajectory end + goal_time. Legacy never path-checked.
    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 2.0
      L_joint1:
        trajectory: 0.0
        goal: 0.05
      L_joint2:
        trajectory: 0.0
        goal: 0.05
      L_joint3:
        trajectory: 0.0
        goal: 0.05
      L_joint4:
        trajectory: 0.0
        goal: 0.05
      L_joint5:
        trajectory: 0.0
        goal: 0.05
      L_joint6:
        trajectory: 0.0
        goal: 0.05
      L_joint7:
        trajectory: 0.0
        goal: 0.05

