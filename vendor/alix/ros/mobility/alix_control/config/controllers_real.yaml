left_hand_controller:
  ros__parameters:
    # §2.9: never call a hand goal done while the hardware says the posture
    # did not reach the hand (write_stuck) or its ANGLE_ACT feedback is
    # stale. A grasp that stops ON an object still succeeds — that is a
    # healthy hand short of its target, and goal_tolerance stays open for it.
    health_gpio: L_hand_health
    # ProfiledPositionController: one target posture per goal (the hand
    # profiles motion internally). Commands + feedback run in all-modbus mode
    # by default (ANGLE_SET writes / measured ANGLE_ACT states, 2026-07-14);
    # hold_until_duration keeps the goal open until the trajectory's nominal
    # duration so downstream sequencing does not race the fingers (~800 ms
    # full stroke no-load, RH56 series manual).
    joints:
      - ILH_left_thumb_1_joint
      - ILH_left_thumb_2_joint
      - ILH_left_index_1_joint
      - ILH_left_middle_1_joint
      - ILH_left_ring_1_joint
      - ILH_left_little_1_joint
    # COMPLETION MODE (DRIVER_EXECUTION_CONTRACTS.md §4, 2026-09-15). The
    # default `tolerance` is the duration-based behaviour described below,
    # byte for byte. A grasp goal that must be judged as HandModbus.command
    # judges it — SETTLED (ANGLE_ACT unchanged <= 3 counts across two
    # samples 200 ms apart, after the stroke law) or ARRIVED (within 15
    # counts of target), bounded by 3x the law — sends its FollowJT goal with
    # goal_time_tolerance = -1 s; the result's error_string then carries
    # `arrived=<0/1> settled=<0/1>`. Set `completion: settle` to make that the
    # controller-wide default instead. arrive_tolerance 0.02 rad = 15 counts
    # on the 1.344 rad fingers; settle_eps 0.003 rad ~ 2-3 counts.
    completion: tolerance
    settle_eps: 0.003
    arrive_tolerance: 0.02
    settle_sample_gap: 0.2
    # goal_tolerance spans the full joint travel (max 1.344 rad) ON PURPOSE:
    # with real ANGLE_ACT feedback (modbus mode, 2026-07-14) a finger that
    # closes ON AN OBJECT stops short of its position target — legacy
    # semantics treat that as a successful grasp, not a tolerance violation.
    # Completion is therefore duration-based (hold_until_duration); measured
    # feedback still flows to /joint_states. Tighten only if position-based
    # grasp-failure detection is explicitly wanted.
    goal_tolerance: 1.5
    goal_time_margin: 3.0
    # SYNC (bench_sync 3-way campaign, BOTH hands 2026-07-27 —
    # alix_hw/doc/BENCHMARKS.md §3.9 "HAND VERDICT"). The feasibility
    # gate passed on both hands, so hand goals now finish on their planned
    # timeline the same way pole goals do.
    #
    # MEASURED stroke law: stroke_ms = t_lat + k*span/SPEED_SET, with
    # k = 370-376 on BOTH hands across three sessions (t_lat ~ 0). The
    # hardware interface maps the velocity command per channel with
    # SPEED_SET = k*v/max_rad, so a commanded rad/s is the delivered rad/s.
    #
    # accel: 0.0 ON PURPOSE — unlike the pole, the hand shows no measurable
    # ramp (t_lat is 1-27 ms over a 150-3000 ms stroke), so the profile is
    # v = distance/duration. CL-5 in BENCHMARKS §3.10 would refine this.
    #
    # Velocity limits follow from the SPEED_SET range [100, 1000] and the
    # channel travels (1.344 rad fingers, 0.5236 rad thumb flexor):
    #   min_match_speed 0.3603 = 100*1.344/373  (the LARGEST-travel channel;
    #     below this a finger is floored -> the goal finishes early)
    #   max_match_speed 1.4038 = 1000*0.5236/373 (the SMALLEST-travel channel;
    #     above this the thumb flexor is capped)
    # Both are conservative: the binding channel is clamped exactly at the
    # limit, others have headroom. The hardware interface clamps per channel
    # regardless, and the controller logs SATURATED when it hits the floor.
    #
    # CONSEQUENCE: a full-span grasp cannot be stretched beyond ~3.7 s
    # (1.344 / 0.3603). Longer goals finish early and wait — benign, and
    # reported, but NOT matched.
    #
    # start_latency 0.115 = the measured command latency (115 ms, sigma 15,
    # both hands). No lead is applied anywhere: the measured hand-arm start
    # skew already lands inside +/-100 ms with none.
    use_velocity_interface: true
    match_trajectory_duration: true
    accel: 0.0
    start_latency: 0.115
    min_match_speed: 0.3603
    max_match_speed: 1.4038
    # ~0.37 s full stroke (1.344 rad) at SPEED_SET 1000 -> ~3.6 rad/s; but
    # velocity-less goals keep the legacy-parity 1.7 rad/s (~0.8 s stroke).
    default_speed: 1.7
    hold_until_duration: true

