# =============================================================================
# LID MECHANISM TASK CONFIGURATION (Open - Compound / Dual-Arm)
# =============================================================================
# This configuration file compounds the right- and left-arm lid-opening
# sequences into a single dual-arm task. Stages execute in order:
#   1. Right arm moves to its inspect pose so the wrist camera frames the
#      CLOSED lid before anything moves (baseline frame; the camera does not
#      move again until the check has run).
#   1b. From the inspect pose the camera confirms the lid is CLOSED; if it is
#      already up this plan skips itself (its outcome already holds).
#   2. Left arm grasps and rotates the lid partially open (-30 deg).
#   3. Settle dwell, then the CHECK: the executive asks perception whether the
#      lid is lifted (depth gap between lid and seat, fail-closed). NO -> the
#      left re-lifts up to three times (max_retries 3), then the row escalates to a human. Only PASS
#      continues.
#      The same frame also says whether the SEAT came up with the lid
#      (also_observe: seat_lifted); if it did, the row ends with
#      seat_close_right (if_observed) so the state left behind is lid_open.
#   4. The scene's lid collision object is moved to match (-30 deg).
#   5. Right arm approaches the partially-open lid (pre-start -> start) and
#      takes the hold.
#   6. Left arm releases, moves to its retract_pose, then returns to rest.
#   7. Right arm traces its trajectory to push the lid fully open; the scene
#      lid is moved to -110 deg, then the right arm returns to rest.
#
# REVERSED 2026-10-05 (Newton): LEFT-first. Until today the RIGHT arm lifted
# to -30 and the LEFT finished to -110 with nothing checking in between; a
# miss was only noticed by the status check scheduled after the whole row.
# The arm that lifts is now the one WITHOUT the camera, so the D435 on the
# right wrist can watch the lift. seat_open.yaml follows the same choreography.
# Companion edits outside this file: fixture_state_publisher.py's state table
# and the cleaning_tasks.launch.py choreography comment.
#
# POSES ARE DRAFTS (evidence: Resource/reports/2026-10-05_p20_lift_check/): the
# per-arm blocks swapped roles, so every pose below is MIRRORED from the other arm's
# pre-reversal taught value (base_link y = 0 reflection: ref-frame
# y' = 0.248 - y, quaternion [qx,qy,qz,qw] -> [qy,qx,qw,qz], path deltas
# [x,-y,z] / [-r,p,-y]) and is UNCALIBRATED — teach + certify before use. The
# raw taught line kept above each pose is the SOURCE arm's capture.
#
# LEFT BLOCK TAUGHT 2026-10-23 (Newton): start_pose, pre_start_pose and the lift
# points come from D_LID_OPEN.txt, the left hand lifting the lid by its
# front-left edge (evidence: Resource/reports/2026-10-23_lid_open_left_recording/):
# ALIX's FK of L_glove_frame_3 in alix_ref_frame, the left pole at half_length
# (150 mm, as stage 2 sets it). The lift is taken to where the lid is at least
# 30 deg (file line 1083), the hand-over below. retract_pose and the right block
# are unchanged.
# Speed classes are unchanged (Newton 2026-10-05: lower speeds for approach
# and when in contact): approach on every pre_start / start / retract leg,
# carry on every execute_path, freespace on rest and inspect moves.
# The check stage (`check:`) plans nothing: the loader carries it in the saved
# plan as a check_fixture_state pre_action and the EXECUTIVE asks perception at
# that boundary, fail-closed (plan/P20-midpoint-lift-check.md).
#
# Task: Mechanism Manipulation - Lid Opening (Dual-Arm)
# =============================================================================

# =============================================================================
# TASK PARAMETERS
# =============================================================================
task_parameters:
  # Operation Parameters
  # -------------------------------------------------------------------------
  operation: "open"
  initial_state: "CLOSED"
  final_state: "OPEN"
  mechanism_type: "lid"
  enable_washroom_scene: true

  # Compound (dual-arm) control
  # -------------------------------------------------------------------------
  compound: true
  arms: ["right", "left"]

  # scene control
  # -------------------------------------------------------------------------
  # Lid opening starts from a fully-closed commode (lid + seat down).
  commode_fixture_type: "closed"               # Options: "closed", "lid_open", "lid_seat_open"
  enable_washroom_structure: true


