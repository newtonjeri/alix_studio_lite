# =============================================================================
# MECHANISM TASK SEQUENCE (Compound - both arms, in order)
# =============================================================================
# Defines the execution order of stages for the dual-arm mechanism manipulation.
# Each motion stage is tagged with `arm:` so the planner uses that arm's
# ik_frame, poses, and trajectory.
#
# Stage types supported:
#   - Movement stages: move_to_pre_start / move_to_start / move_to_retract /
#     move_to_rest / move_to_inspect (Cartesian or SRDF pose), hand_grasp /
#     hand_release, move_to_half_pole_length
#   - allow_collision / forbid_collision: toggle hand<->surface collision pairs
#   - trace_trajectory: Follow a 6DOF trajectory with interpolation
#   - update_fixture_scene: move the dynamic lid/seat collision object in-place
#   - a stage with `hold_time:` is a dwell, deferred to execution (no trajectory)
#   - a stage with `check:` is a perception gate, deferred to execution (a
#     check_fixture_state pre_action in the saved plan) — see stage 3
#
# Pose resolution order (matches single-arm behavior):
#   1. Check joint_space_poses[planning_group][pose_name]
#   2. Check cartesian_poses[pose_name]
#   3. Fall back to SRDF named state (e.g., "grasp", "open", "ready")
#   (compound: per-arm joint_space_poses are dropped at load, so step 1 is
#    empty and a joint-space goal such as inspection_pose_4 is the SRDF's)
# =============================================================================
stage_sequence:
  # Add washroom scene setup stage
  - stage: "setup_washroom_scene"
    conditional: true
    condition_param: "enable_washroom_scene"

  - stage: "current_state"

  # ---------------------------------------------------------------------------
  # 1. RIGHT arm frames the closed lid (wrist camera) BEFORE anything moves
  # ---------------------------------------------------------------------------
  # Pole first, so the camera height is pinned for the baseline frame and the
  # check (the pole does not move between them). HALF length (Newton, 2026-10-05
  # 15:40): at quarter length the right hand hung inside the lid's swing and
  # the rising lid met its fingers at ~15 deg (sim, depth 0.392 -> 0.337 m and
  # back); half length lifts the hand 75 mm clear of the -30 deg edge (z 0.65 m
  # in base_link) and is the height the right-arm poses are taught at, so
  # block 5 needs no pole move.
  - stage: "move_to_inspect_pole_length"
    arm: "right"
    pose_name: "half_length"
    planning_group: "pole_right"

  # Fingers CLOSED (grasp) while the camera watches: an open hand dangles its
  # fingertips ~100 mm below the palm, into the path of the rising lid.
  - stage: "hand_grasp"
    arm: "right"
    pose_name: "grasp"
    planning_group: "inspire_hand_right"

  # inspection_pose_4: the LIFT CHECK VIEWPOINT (Newton 2026-10-05, his RViz
  # goal state, arm joints unchanged, pole raised to half length 15:40; SRDF group_state of
  # rm75_arm_right, source alix_moveit_config/config/group_states/
  # arms_group_states.yaml). From here the wrist camera frames the lid front
  # edge and the seat below it, lid closed and lid at -30 alike. Compound
  # loading drops per-arm joint_space_poses, so the pose is an SRDF state;
  # planning_group is explicit because state names repeat across groups. The
  # arm then stays put through the lift, the dwell and the check: no camera
  # motion between the baseline frame and the check.
  - stage: "move_to_inspect"
    speed_class: freespace
    arm: "right"
    pose_name: "inspection_pose_4"
    planning_group: "rm75_arm_right"

  # THE STATE THIS PLAN NEEDS (Newton 2026-10-07, flow): the lid must be CLOSED
  # (the centre ROI at its closed height). NO -> on_fail skip: the lid is
  # already up, this plan's outcome holds, it ends here as done and the arms
  # are parked at its end state. A check_fixture_state pre_action of the next
  # sub-trajectory, fail-closed like the lift check below.
  - stage: "verify_lid_closed"
    check: "fixture_gap"
    expect: "lid_closed"
    arm: "right"
    on_fail: "skip"

  # ---------------------------------------------------------------------------
  # 2. LEFT arm lifts the lid to -30 deg
  # ---------------------------------------------------------------------------
  - stage: "hand_release"
    arm: "left"
    pose_name: "release"
    planning_group: "inspire_hand_left"

  - stage: "move_to_half_pole_length"
    arm: "left"
    pose_name: "half_length"
    planning_group: "pole_left"

  - stage: "hand_grasp"
    arm: "left"
    pose_name: "half_grasp"
    planning_group: "inspire_hand_left"

  - stage: "move_to_pre_start"
    speed_class: approach
    arm: "left"
    pose_name: "pre_start_pose"
    planning_group: "rm75_arm_left"
    conditional: true
    condition_param: "use_prestart_stage"

  # Allow collision between hand and commode lid (+ seat below it) before opening.
  # Newton 2026-10-09: the BODY too — the retry ladder's third rung (z -5 mm) sweeps
  # the middle fingertip into commode_body early in the arc (0.46 s), and the
  # fingers under the lid lip do meet the bowl rim there on the real fixture.
  - stage: "allow_collision"
    arm: "left"
    contact_surface: "all"

  - stage: "move_to_start"
    speed_class: approach
    arm: "left"
    pose_name: "start_pose"
    planning_group: "rm75_arm_left"

  - stage: "execute_path"
    speed_class: carry
    arm: "left"

  # ---------------------------------------------------------------------------
  # 3. Settle, then CHECK that the lid is lifted (executive, fail-closed)
  # ---------------------------------------------------------------------------
  # Settle dwell (the `hold_time:` key makes it one): the left hand holds the
  # lid still for 1 s before the image; recorded in the saved plan as a
  # hold_pose pre_action of the next sub-trajectory.
  - stage: "settle_before_check"
    hold_time: 1.0

  # THE LIFT CHECK. A `check:` key makes this a perception check, as
  # `hold_time:` makes a dwell: no MTC stage, no trajectory. The saved plan is
  # CUT here: the loader carries the stage as a check_fixture_state pre_action
  # of the next sub-trajectory, and the executive (dual_arm_trajectory_sender /
  # arm_executive) asks perception at that boundary from the right wrist
  # camera, FAIL-CLOSED: no service, no answer, a refused mode, low confidence
  # or an unexpected state all read as NOT lifted. PASS -> the row continues
  # below. NO -> on_fail retry_lift: the LEFT (lifting) arm alone is taken back
  # to the lift block's recorded start on a collision-planned path and the lift
  # legs replay, check included, up to max_retries times (3, Newton 2026-10-05);
  # the camera arm never moves; one more NO escalates the row to a human
  # (escalate_to_human). The fixture
  # scene is never advanced on NO. The task node's own controller execution
  # refuses the check (it has no perception client): generate with plan_only
  # and replay the saved plan through the executive.
  #   check: fixture_gap - the depth-gap mode (perception_node gap_check,
  #          2026-10-05): the central ROI's median height against the closed
  #          top, lid_lifted iff 50 mm higher (Isaac: 160 mm at -30 deg).
  #          fixture_state would ask the status classifier instead, which
  #          answered lid_open at 0.49-0.50 confidence on the lifted lid.
  #   also_observe / if_observed (Newton 2026-10-05, flow): the SAME frame
  #          also says whether the SEAT came up with the lid (the hook sits
  #          under both lips where the lid does not overhang the seat: the
  #          seat ring is then ABSENT from its closed place, the rim shows).
  #          When it did, the executive runs `if_observed` (seat_close_right,
  #          a saved plan of the same mode, else the task node live) right
  #          after this row, so the established state is lid_open — not
  #          lid_seat_open — and the seat row later finds a closed seat.
  #          Neither key changes this check's verdict.
  - stage: "verify_lid_lifted"
    check: "fixture_gap"
    expect: "lid_lifted"
    arm: "right"
    on_fail: "retry_lift"
    max_retries: 3
    # The retry ladder (Newton 2026-10-09). The miss is the hook fingers not
    # getting far enough between lid and seat along -y, so each retry plays a
    # pre-planned LEFT lift block with the taught start_pose translated by the
    # entry below (metres, alix_ref_frame axes; pre_start and the arc points
    # follow the start). One entry per retry, in order; after the third miss
    # the row escalates to a human.
    retry_offsets:
      - {y: -0.005}
      - {y: -0.010}
      - {y: -0.005, z: -0.005}
    also_observe: "seat_lifted"
    if_observed: "seat_close_right"

  # ---------------------------------------------------------------------------
  # 4. Scene: lid to -30 deg (only reached on PASS)
  # ---------------------------------------------------------------------------
  # Lid is now physically (partially) open -> update the dynamic collision scene
  # so the right arm plans against the moved lid. Only reached on PASS: the
  # finish legs below are planned against the lifted lid. Only the LID angle is
  # given: the seat stays closed below the lid and must stay put, so it is
  # intentionally NOT listed here. Does NOT modify commode_fixture_type.
  # (The hand<->lid allowance is re-asserted automatically on this stage, for
  # both hands' contact links.)
  - stage: "update_fixture_scene"
    lid_angle_deg: -30.0

  # ---------------------------------------------------------------------------
  # 5. RIGHT arm takes the hold (pre-start, then start)
  # ---------------------------------------------------------------------------
  # - stage: "hand_release"
  #   arm: "right"
  #   pose_name: "release"
  #   planning_group: "inspire_hand_right"

  # Pole already at half_length since the inspect block: this stage is a no-op
  # kept so the block reads like every other approach.
  - stage: "move_to_half_pole_length"
    arm: "right"
    pose_name: "half_length"
    planning_group: "pole_right"

  - stage: "hand_grasp"
    arm: "right"
    pose_name: "half_grasp"
    planning_group: "inspire_hand_right"

  - stage: "move_to_pre_start"
    speed_class: approach
    arm: "right"
    pose_name: "pre_start_pose"
    planning_group: "rm75_arm_right"
    conditional: true
    condition_param: "use_prestart_stage"

  # Allow collision between hand and commode lid (+ seat below it) before holding
  - stage: "allow_collision"
    arm: "right"
    contact_surface: "seat_and_lid"
    additional_ik_frames: ["R_glove_frame_2"]

  - stage: "move_to_start"
    speed_class: approach
    arm: "right"
    pose_name: "start_pose"
    planning_group: "rm75_arm_right"

  - stage: "hand_release"
    arm: "right"
    pose_name: "release"
    planning_group: "inspire_hand_right"

  # ---------------------------------------------------------------------------
  # 6. LEFT arm releases the lid, retracts (to retract_pose), then rests
  # ---------------------------------------------------------------------------
  - stage: "hand_release"
    arm: "left"
    pose_name: "release"
    planning_group: "inspire_hand_left"

  - stage: "move_to_retract"
    speed_class: approach
    arm: "left"
    pose_name: "retract_pose"
    planning_group: "rm75_arm_left"

  - stage: "hand_grasp"
    arm: "left"
    pose_name: "grasp"
    planning_group: "inspire_hand_left"

  # Hand has left the lid -> restore normal hand<->lid collision checking.
  - stage: "forbid_collision"
    arm: "left"
    contact_surface: "seat_and_lid"

  - stage: "move_to_rest"
    speed_class: freespace
    arm: "left"
    pose_name: "rest_pose"
    planning_group: "rm75_arm_left"

  # ---------------------------------------------------------------------------
  # 7. RIGHT arm traces its opening trajectory to -110 deg
  # ---------------------------------------------------------------------------
  - stage: "execute_path"
    speed_class: carry
    arm: "right"

  # Lid now fully open -> move only the lid to -110°; seat stays closed.
  - stage: "update_fixture_scene"
    lid_angle_deg: -110.0

  - stage: "move_to_rest"
    speed_class: freespace
    arm: "right"
    pose_name: "rest_pose"
    planning_group: "rm75_arm_right"

  # Forbid collisions between hand and commode after opening
  - stage: "forbid_collision"
    arm: "right"
    contact_surface: "seat_and_lid"
