# =============================================================================
# LID CLOSE RIGHT
# =============================================================================
# MIRRORED 2026-08-16 from lid_close_left.yaml (base_link Y=0 reflection).
# ik_frame is not set here on purpose: mechanism_tasks/task_parameters_defaults.yaml
# supplies R_tip_frame via arm_defaults.right, exactly as the left twin inherits
# L_tip_frame.
# =============================================================================
# =============================================================================
# LID MECHANISM TASK CONFIGURATION (Close - Right Arm)
# =============================================================================
# This configuration file contains all poses, trajectories, and sequences for
# closing the toilet lid using the right arm.
# 
# Task: Mechanism Manipulation - Lid Closing
# =============================================================================

# =============================================================================
# TASK PARAMETERS
# =============================================================================
task_parameters:
  # Operation Parameters
  # -------------------------------------------------------------------------
  operation: "close"
  initial_state: "LID_OPEN"
  final_state: "CLOSE"
  mechanism_type: "lid"

  ik_frame: "R_tip_frame"                     # End-effector IK frame

  # Scene control
  # -------------------------------------------------------------------------
  commode_fixture_type: "lid_seat_open"              # Options: "closed", "lid_open", "lid_seat_open"               

# =============================================================================
# CARTESIAN POSES (Position + Orientation)
# Format: [x, y, z, qx, qy, qz, qw]
# =============================================================================
cartesian_poses:
  # start_pose: [1.062, 0.175, 0.285, 0.86066, 0.1031, 0.46581, 0.17792]

  start_pose: [1.075, 0.073, 0.285, 0.1031, 0.86066, 0.17792, 0.46581]
  # pre_start_pose: [0.97, 0.16, 0.33, 0.86066, 0.1031, 0.46581, 0.17792]

  pre_start_pose: [1.0, 0.078, 0.36, 0.1031, 0.86066, 0.17792, 0.46581]


# =============================================================================
# CLEANING POINTS (Translation [x,y,z] + Rotation [r,p,y])
# Translation: [x, y, z] in meters
# Rotation: [roll, pitch, yaw] in degrees
# Relative to vector_frame_id (alix_ref_frame)
# =============================================================================
cleaning_points:
  point1:
    translation: [0.0, 0.0, -0.015]              # [x, y, z] in meters (angle: 180.0°, radius: 290.0mm)
    rotation: [10.0, 0.0, 0.0]                 # [roll, pitch, yaw] in degrees (pitch = 0.0°)
  point2:
    translation: [-0.03, -0.005, -0.025]
    rotation: [5.0, 5.0, 0.0]
  point3:
    translation: [-0.1, -0.01, -0.02]
    rotation: [5.0, 10.0, 0.0]
  point4:
    translation: [-0.15, -0.02, -0.025]
    rotation: [7.0, 15.0, 0.0]
  point5:
    translation: [-0.2, -0.03, -0.03]
    rotation: [15.0, 20.0, 0.0]
  point6:
    translation: [-0.26, -0.04, -0.035]
    # rotation: [-20.0, 25.0, 0.0]
    rotation: [12.0, 25.0, 0.0]
  point7:
    translation: [-0.28, -0.05, -0.04]
    # rotation: [-25.0, 25.0, 0.0]
    rotation: [7.0, 25.0, 0.0]
  point8:
    translation: [-0.3, -0.055, -0.15]
    # rotation: [-25.0, 35.0, 0.0]
    rotation: [2.0, 35.0, 0.0]
  point9:
    translation: [-0.31, -0.06, -0.25]
    # rotation: [-25.0, 45.0, 0.0]
    rotation: [0.0, 45.0, 0.0]
  point10:
    translation: [-0.32, -0.065, -0.35]
    # rotation: [-25.0, 45.0, 0.0]
    rotation: [0.0, 45.0, 0.0]
# =============================================================================
# CLEANING SEQUENCE
# Defines the order of trajectory points during execution
# Format: [from, to, from, to, ...] - pairs of point names
# =============================================================================
cleaning_sequence:
- [point1, point2]
- [point2, point3]
- [point3, point4]
- [point4, point5]
- [point5, point6]
- [point6, point7]
- [point7, point8]
- [point8, point9]
- [point9, point10]
  # - [point8, point7]
  # - [point7, point6]
  # - [point6, point5]

# =============================================================================
# MECHANISM TASK SEQUENCE
# Defines the execution order of stages for the mechanism manipulation
# 
# Stage types supported:
#   - Movement stages: move_to_*, start_pose, grasp, release, retract, etc.
#   - allow_collision: Explicitly disable collisions between specified pairs
#   - trace_trajectory: Follow a 6DOF trajectory with interpolation
# 
# Pose resolution order (matches toplid behavior):
#   1. Check joint_space_poses[planning_group][pose_name]
#   2. Check cartesian_poses[pose_name]
#   3. Fall back to SRDF named state (e.g., "grasp", "open", "ready")
# =============================================================================
stage_sequence:
  # Add washroom scene setup stage
- stage: "setup_washroom_scene"
  conditional: true
  condition_param: "enable_washroom_scene"

- stage: "current_state"

# Precondition block (Newton 2026-10-07): the lid must be UP (else this plan skips itself) and the seat DOWN (else seat_close_right runs first).
# ---------------------------------------------------------------------------
# 0. THE STATE THIS PLAN NEEDS (Newton 2026-10-07, flow). The right arm, which
# carries the camera, looks first: pole at half length, fingers closed, the
# lift-check viewpoint inspection_pose_4 (the same block the compound lid and
# seat tasks use). Each check is a check_fixture_state pre_action of the next
# sub-trajectory, fail-closed; the task node plans nothing for it.
# ---------------------------------------------------------------------------
- stage: "move_to_inspect_pole_length"
  pose_name: "half_length"
  planning_group: "pole_right"

- stage: "hand_grasp_for_inspect"
  pose_name: "grasp"
  planning_group: "inspire_hand_right"

- stage: "move_to_inspect"
  speed_class: freespace
  pose_name: "inspection_pose_4"
  planning_group: "rm75_arm_right"

- stage: "verify_lid_open"
  check: "fixture_gap"
  expect: "lid_open"
  arm: "right"
  on_fail: "skip"             # the lid is already down: this plan's outcome holds

- stage: "verify_seat_closed"
  check: "fixture_gap"
  expect: "seat_closed"
  arm: "right"
  on_fail: "run_prerequisite" # the seat must be down before the lid comes down on it
  prerequisite: "seat_close_right"
  max_retries: 1


- stage: "move_pole_to_max_height"
  pose_name: "full_length"
  planning_group: "pole_right"

- stage: "release"
  pose_name: "release"
  planning_group: "inspire_hand_right"

- stage: "move_to_pre_start"
  speed_class: approach
  pose_name: "pre_start_pose"
  planning_group: "rm75_arm_right"
  conditional: false
  condition_param: "use_prestart_stage"

  # Allow hand↔lid/seat contact BEFORE move_to_start: the start pose presses
  # the glove onto the open lid, so with this stage after move_to_start every
  # goal IK sample is "in collision" and planning fails (GOAL_STATE_INVALID).
- stage: "allow_collision"
  contact_surface: "seat_and_lid"
  additional_ik_frames: ["R_glove_frame_2"]

- stage: "move_to_start"
  speed_class: approach
  pose_name: "start_pose"
  planning_group: "rm75_arm_right"

- stage: "execute_path"
  speed_class: carry

# ADDED 2026-08-16, mirroring lid_close_left — see that file for the reasoning.
# Both angles: the schedule runs no `seat_close`, so the seat is still at -110
# here and the closing lid carries it down with it. Placed BEFORE
# `forbid_collision` so checking resumes against correct geometry.
- stage: "update_fixture_scene"
  lid_angle_deg: 0.0
  seat_angle_deg: 0.0

  # # Forbid collisions between hand and commode after opening
- stage: "forbid_collision"
  contact_surface: "seat_and_lid"
- stage: "move_to_ready"
  pose_name: "ready"
  planning_group: "rm75_arm_right"

  # # Full Length pole
- stage: "move_pole_to_max_height"
  pose_name: "full_length"
  planning_group: "pole_right"

- stage: "hand_grasp"
  pose_name: "grasp"
  planning_group: "inspire_hand_right"

