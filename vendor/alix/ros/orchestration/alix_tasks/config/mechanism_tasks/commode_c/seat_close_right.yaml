# =============================================================================
# SEAT CLOSE RIGHT
# =============================================================================
# MIRRORED 2026-08-16 from seat_close_left.yaml (base_link Y=0 reflection,
# the same transform measured at a median 0.000 mm across the 15 hand-authored
# commode_c pairs). Mirrored from the LEFT close task rather than derived from
# seat_open_right, because that config lifts only 0.03 m / +15 deg against the
# seat's declared 0 -> -110 deg travel and is almost certainly unfinished.
# =============================================================================
# =============================================================================
# SEAT MECHANISM TASK CONFIGURATION (Close - Right Arm)
# =============================================================================
# DERIVED 2026-08-16 from seat_open_left.yaml by REVERSING its path: the same
# calibrated contact points, traversed from the lifted seat back down to
# closed. start_pose is the open task's final contact pose (its point7),
# recomputed as an absolute pose and re-anchored, so the two tasks meet exactly
# where the seat is left standing. pre_start_pose keeps the same world-frame
# approach offset the open task uses.
#
# Scaffolding (stage_sequence, pole and hand stages, collision surface) is
# inherited verbatim from the open task — same arm, same grip, same fixture.
#
# NOT hand-verified on hardware. The seat's declared travel is 0 -> -110 deg
# (commode_c scene.yaml); the open task it derives from stops at -60 deg, so
# this closes from -60, not from fully open.
# =============================================================================
task_parameters:
  # Operation Parameters
  # -------------------------------------------------------------------------
  operation: "close"
  initial_state: "SEAT_OPEN"
  final_state: "SEAT_CLOSED"
  mechanism_type: "seat"

  # scene control
  # -------------------------------------------------------------------------
  commode_fixture_type: "lid_seat_open"         # Options: "closed", "lid_open", "lid_seat_open"

  # Kinematics / IK
  # -------------------------------------------------------------------------
  ik_frame: "R_glove_frame_3"


# =============================================================================
# CARTESIAN POSES (Position + Orientation)
# Format: [x, y, z, qx, qy, qz, qw]
# =============================================================================
cartesian_poses:
  #  0.65111; 0.26297; -0.0024192, 0.59513; 0.80224; 0.04093; 0.02365
  start_pose:
  - 0.96042
  - -0.02341
  - 0.17851
  - 0.625971
  - 0.605019
  - 0.343509
  - 0.352299

  # 0.55594; 0.29064; -0.056348, 0.705; 0.70895; 0.016624; -0.0096141
  pre_start_pose:
  - 0.85594
  - -0.04264
  - 0.16365
  - 0.625971
  - 0.605019
  - 0.343509
  - 0.352299


# =============================================================================
# CLEANING POINTS (Translation [x,y,z] + Rotation [r,p,y])
# Translation: [x, y, z] in meters
# Rotation: [roll, pitch, yaw] in degrees
# Relative to vector_frame_id (alix_ref_frame)
# =============================================================================
cleaning_points:
  point1:
    translation:
    - 0.0
    - 0.0
    - 0.0
    rotation:
    - 0.0
    - 0.0
    - 0.0
  point2:
    translation:
    - -0.08
    - 0.0
    - -0.04
    rotation:
    - 0.0
    - 10.0
    - 0.0
  point3:
    translation:
    - -0.15
    - 0.0
    - -0.07
    rotation:
    - 0.0
    - 30.0
    - 0.0
  point4:
    translation:
    - -0.22
    - 0.0
    - -0.12
    rotation:
    - 0.0
    - 40.0
    - 0.0
  point5:
    translation:
    - -0.27
    - 0.0
    - -0.16
    rotation:
    - 0.0
    - 45.0
    - 0.0
  point6:
    translation:
    - -0.28
    - 0.0
    - -0.19
    rotation:
    - 0.0
    - 55.0
    - 0.0
  point7:
    translation:
    - -0.3
    - 0.0
    - -0.22
    rotation:
    - 0.0
    - 60.0
    - 0.0



# =============================================================================
# CLEANING SEQUENCE
# Defines the order of trajectory points during execution
# Format: [from, to, from, to, ...] - pairs of point names
# =============================================================================
cleaning_sequence:
- - point1
  - point2
- - point2
  - point3
- - point3
  - point4
- - point4
  - point5
- - point5
  - point6
- - point6
  - point7
stage_sequence:
  # Add washroom scene setup stage
- stage: "setup_washroom_scene"
  conditional: true
  condition_param: "enable_washroom_scene"

- stage: "current_state"

# Precondition block (Newton 2026-10-07): the seat must be UP (else this plan skips itself) under an OPEN lid.
# ---------------------------------------------------------------------------
# 0. THE STATE THIS PLAN NEEDS (Newton 2026-10-07, flow). The right arm, which
# carries the camera, looks first: pole at half length, fingers closed, the
# lift-check viewpoint inspection_pose_4 (the same block the compound lid and
# seat tasks use). Each check is a check_fixture_state pre_action of the next
# sub-trajectory, fail-closed; the task node plans nothing for it.
# ---------------------------------------------------------------------------
- stage: "move_to_inspect_pole_length"
  pose_name: "half_length"
  planning_group: "pole_right"

- stage: "hand_grasp_for_inspect"
  pose_name: "grasp"
  planning_group: "inspire_hand_right"

- stage: "move_to_inspect"
  speed_class: freespace
  pose_name: "inspection_pose_4"
  planning_group: "rm75_arm_right"

- stage: "verify_lid_open"
  check: "fixture_gap"
  expect: "lid_open"
  arm: "right"
  on_fail: "abort"            # a seat cannot stand open under a closed lid; a closed lid here is a scene error

- stage: "verify_seat_open"
  check: "fixture_gap"
  expect: "seat_open"
  arm: "right"
  on_fail: "skip"             # the seat is already down: this plan's outcome holds, nothing to close


- stage: "hand_release"
  pose_name: "release"
  planning_group: "inspire_hand_right"

- stage: "move_to_quarter_pole_length"
  pose_name: "quarter_length"
  planning_group: "pole_right"

- stage: "hand_grasp"
  pose_name: "half_grasp"
  planning_group: "inspire_hand_right"

  # Release 
  # - stage: "release"
- stage: "move_to_pre_start"
  speed_class: approach
  pose_name: "pre_start_pose"
  planning_group: "rm75_arm_right"
  conditional: true
  condition_param: "use_prestart_stage"

  # Allow collision between hand and commode seat before opening
- stage: "allow_collision"
  contact_surface: "seat"

- stage: "move_to_start"
  speed_class: approach
  pose_name: "start_pose"
  planning_group: "rm75_arm_right"

  # 6. Trace opening trajectory 
- stage: "execute_path"
  speed_class: carry

# ADDED 2026-08-16, mirroring seat_close_left — see that file for the reasoning.
# The lid is held at -110 on purpose: this task closes the seat only, and
# omitting the lid angle would resolve the fixture to CLOSED and drop the
# raised lid out of the collision scene.
- stage: "update_fixture_scene"
  seat_angle_deg: 0.0
  lid_angle_deg: -110.0

# ADDED 2026-08-16, mirroring seat_close_left — this task opened an
# `allow_collision` bracket it never closed, leaving seat collisions disabled
# through `move_to_rest`. Placed after `update_fixture_scene` so checking
# resumes against the seat at 0 deg.
- stage: "forbid_collision"
  contact_surface: "seat"

- stage: "move_to_rest"
  pose_name: "rest_pose"
  planning_group: "rm75_arm_right"
