      translation: [0.33, 0.05, 0.25]
      rotation: [0.0, -10.0, 0.0]

  # CLEANING SEQUENCE
  # Format: [from, to] - pairs of point names
  # ---------------------------------------------------------------------------
  cleaning_sequence:
