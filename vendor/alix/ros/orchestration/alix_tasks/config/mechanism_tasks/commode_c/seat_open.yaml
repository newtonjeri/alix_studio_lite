  #     rotation: [0.0, -60.0, 0.0]       # DRAFT: mirrored from left.cleaning_points.point7 (UNCALIBRATED - teach + certify before use)
  cleaning_points:
    point1:
      translation: [0.0, 0.0, 0.0]
      rotation: [0.0, 0.0, 0.0]
    point2:
      translation: [0.02, 0.0, 0.03]
      rotation: [0.0, 0.0, 0.0]
    point3:
      translation: [0.03, 0.02, 0.06]
