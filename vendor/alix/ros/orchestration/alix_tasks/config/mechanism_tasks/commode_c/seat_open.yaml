# =============================================================================
# MECHANISM TASK SEQUENCE (Compound - both arms, in order)
# =============================================================================
# Defines the execution order of stages for the dual-arm mechanism manipulation.
# Each motion stage is tagged with `arm:` so the planner uses that arm's
# ik_frame, poses, and trajectory.
#
# Stage types supported:
#   - Movement stages: move_to_pre_start / move_to_start / move_to_retract /
#     move_to_rest (Cartesian or SRDF pose), move_to_inspect (SRDF pose),
#     hand_grasp / hand_release, move_to_quarter_pole_length
#   - allow_collision / forbid_collision: toggle hand<->surface collision pairs
#   - trace_trajectory: Follow a 6DOF trajectory with interpolation
#   - update_fixture_scene: move the dynamic lid/seat collision object in-place
#   - <any name> + hold_time: a dwell, deferred to execution (hold_pose effect)
#   - <any name> + check: a perception CHECK, deferred to execution (a
#     check_fixture_state pre_action in the saved plan; fail-closed)
#
# Speed classes are the C3 table of task_parameters_defaults.yaml (approach
# 0.2 / carry 0.5 / freespace 0.8), unchanged (Newton 2026-10-05): approach on
# every pre_start / start / retract leg, carry on every execute_path, freespace
# on rest and inspect moves. Linearity-critical legs (move_to_start,
# move_to_retract) carry NO planner key. The ik_frame decides the collision
# allowance: no collisions / extra_collisions / additional_ik_frames here.
#
# Pose resolution order (matches single-arm behavior):
#   1. Check joint_space_poses[planning_group][pose_name]
#   2. Check cartesian_poses[pose_name]
#   3. Fall back to SRDF named state (e.g., grasp, open, ready)
# =============================================================================
stage_sequence:
  # Add washroom scene setup stage
  - stage: setup_washroom_scene
    conditional: true
    condition_param: enable_washroom_scene

  - stage: current_state

  # ---------------------------------------------------------------------------
  # 1. RIGHT arm goes to its inspect pose FIRST (baseline frame of the closed seat)
  # ---------------------------------------------------------------------------
  # Pole first, so the camera height is pinned for the baseline frame and the
  # check. HALF length (Newton, 2026-10-05 15:40): at quarter length the right
  # hand hung inside the part's swing (lid_open, sim); half length keeps the
  # fingers clear of the -30 deg edge. Block 5 brings the pole to the seat
  # task's working height, quarter_length, before the right arm approaches.
  - stage: move_to_inspect_pole_length
    arm: right
    pose_name: half_length
    planning_group: pole_right

  # Fingers CLOSED (grasp) while the camera watches: an open hand dangles its
  # fingertips ~100 mm below the palm, into the path of the rising seat.
  - stage: hand_grasp
    arm: right
    pose_name: grasp
    planning_group: inspire_hand_right

  # A free move with no contact: freespace. inspection_pose_4 is the LIFT
  # CHECK VIEWPOINT (Newton 2026-10-05, his RViz goal state, pole raised to
  # half length 15:40; SRDF group_state of rm75_arm_right, source
  # alix_moveit_config/config/group_states/arms_group_states.yaml): the wrist
  # camera frames the seat front edge and the rim below it, with the lid
  # standing at -110 behind. planning_group is explicit because state names
  # repeat across groups. The arm then stays put through the lift, the dwell
  # and the check: no camera motion between the baseline frame and the check.
  - stage: move_to_inspect
    speed_class: freespace
    arm: right
    pose_name: inspection_pose_4
    planning_group: rm75_arm_right

  # THE STATE THIS PLAN NEEDS (Newton 2026-10-07, flow). Before the left arm
  # moves, the same camera answers two questions from the inspect pose (each a
  # check_fixture_state pre_action of the next sub-trajectory, fail-closed):
  #   verify_lid_open    the lid must be OPEN (absent from its closed place: the
  #                      centre ROI sees into the bowl). NO -> on_fail
  #                      run_prerequisite: the executive runs the `prerequisite`
  #                      plan (lid_open_<mode>.json beside this one, with its
  #                      own checks and follow-ups) and then restarts THIS plan
  #                      from its first stage, once (max_retries). 2026-10-07:
  #                      this plan was replayed on a closed lid and the left
  #                      pre-start drove into it until the controller aborted.
  #   verify_seat_closed the seat must still be DOWN (the ring at its closed
  #                      height in the front ROI). NO -> on_fail skip: the
  #                      seat is already up, this plan's outcome holds, it ends
  #                      here as done and the arms are parked at its end state.
  - stage: verify_lid_open
    check: fixture_gap
    expect: lid_open
    arm: right
    on_fail: run_prerequisite
    prerequisite: lid_open
    max_retries: 1

  - stage: verify_seat_closed
    check: fixture_gap
    expect: seat_closed
    arm: right
    on_fail: skip

  # ---------------------------------------------------------------------------
  # 2. LEFT arm lifts the seat (partial lift, 0 -> -30 deg)
  # ---------------------------------------------------------------------------
  - stage: hand_release
    arm: left
    pose_name: release
    planning_group: inspire_hand_left

  - stage: move_to_quarter_pole_length
    arm: left
    pose_name: quarter_length
    planning_group: pole_left

  - stage: hand_grasp
    arm: left
    pose_name: half_grasp
    planning_group: inspire_hand_left

  - stage: move_to_pre_start
    speed_class: approach
    arm: left
    pose_name: pre_start_pose
    planning_group: rm75_arm_left
    conditional: true
    condition_param: use_prestart_stage

  # Allow hand<->fixture contact BEFORE moving onto the seat.
  #
  # FIXED 2026-08-17 -- this task could not plan at all. It failed with
  #   PLANNING_FAILED: stage 'move_to_start/joint' -- IK failed for pose target
  # which is a MISLEADING MESSAGE: the pose is reachable. MTC's ComputeIK
  # discards solutions that are in collision and reports the discard as an IK
  # failure, so a contact pose whose contact is not yet allowed reads as
  # unreachable.
  #
  # THE ACTUAL CAUSE was the SURFACE, not the ordering. `contact_surface` was
  # seat, but the hand reaching the seat's front edge also touches the
  # commode BODY (the bowl rim). One unallowed pair is enough to reject every
  # solution. Widening to seat_and_body makes the task plan first time.
  #
  # Evidence, so the next person does not repeat the search:
  #   * the pose solves standalone through /compute_ik on R_glove_frame_3 at
  #     every pole extension and with collisions on -- tools/probe_task_ik.py;
  #   * with commode_fixture_type forced to closed the failure moves EARLIER,
  #     to move_to_pre_start, which is what proved the fixture geometry (not
  #     the arm's reach) was gating these stages.
  # Moving allow_collision ahead of move_to_start was tried first and did NOT
  # fix it; it is kept because a contact pose should have its allowance in
  # force before the arm is sent there, which is also what lid_open does.
  # 2026-10-05: that evidence was gathered on the RIGHT arm's taught start;
  # the LEFT's mirrored start is the same seat-front point 12 mm across, so
  # the same surface applies -- re-probe on L_glove_frame_3 when it is taught.
  - stage: allow_collision
    arm: left
    contact_surface: seat_and_body
    additional_ik_frames: [L_glove_frame_2]

  - stage: move_to_start
    speed_class: approach
    arm: left
    pose_name: start_pose
    planning_group: rm75_arm_left

  - stage: execute_path
    speed_class: carry
    arm: left

  # ---------------------------------------------------------------------------
  # 3. Settle, then the camera CHECK (the saved plan is CUT here)
  # ---------------------------------------------------------------------------
  # Settle dwell so the seat is still when it is measured. The `hold_time` key
  # marks a dwell: a trajectory-less stage, a hold_pose pre_action of the next
  # sub-trajectory at execution, played before the check that follows it. It
  # carries no speed class.
  - stage: settle_before_check
    hold_time: 1.0

  # THE LIFT CHECK. A `check:` key makes this a perception check, as
  # `hold_time:` makes a dwell: no MTC stage, no trajectory. The saved plan is
  # CUT here: the loader carries the stage as a check_fixture_state pre_action
  # of the next sub-trajectory, and the executive (dual_arm_trajectory_sender /
  # arm_executive) asks perception at that boundary from the right wrist
  # camera, FAIL-CLOSED: no service, no answer, a refused mode, low confidence
  # or an unexpected state all read as NOT lifted. PASS -> the row continues
  # below. NO -> on_fail retry_lift: the LEFT (lifting) arm alone is taken back
  # to the lift block's recorded start on a collision-planned path and the lift
  # legs replay, check included, up to max_retries times (1 here); the camera
  # arm never moves; one more NO escalates the row to a human
  # (escalate_to_human). The fixture
  # scene is never advanced on NO. The task node's own controller execution
  # refuses the check (it has no perception client): generate with plan_only
  # and replay the saved plan through the executive.
  #   check: fixture_gap - the depth-gap mode (perception_node gap_check,
  #          2026-10-05): the central ROI's median height against the closed
  #          top, seat_lifted iff 50 mm higher (Isaac: 160 mm at -30 deg).
  #          fixture_state would ask the status classifier instead, which
  #          answered lid_open at 0.49-0.50 confidence on the lifted lid.
  - stage: verify_seat_lifted
    check: fixture_gap
    expect: seat_lifted
    arm: right
    on_fail: retry_lift
    max_retries: 1

  # ---------------------------------------------------------------------------
  # 4. Scene: seat -30 deg (the PASS branch)
  # ---------------------------------------------------------------------------
  # Seat is now physically (partially) open -> update the dynamic collision scene
  # so the right arm plans against the moved seat. Plan-time only
  # (task_base.cpp:4576): the finish legs below are PLANNED against the lifted
  # seat, and at execution they are only REACHED on a PASS of the check above.
  # Only the SEAT angle is given: the lid is already fully open
  # (commode_fixture_type: lid_open) and must stay put, so it is intentionally
  # NOT listed here. Does NOT modify commode_fixture_type.
  # (The hand<->seat allowance of BOTH arms' ik_frames is re-asserted
  # automatically on this stage.)
  - stage: update_fixture_scene
    seat_angle_deg: -30.0

  # ---------------------------------------------------------------------------
  # 5. RIGHT arm takes the hold (pre-start -> start on the lifted seat)
  # ---------------------------------------------------------------------------
  # P20: leave the inspect pose through rest BEFORE the pole drops to quarter length
  # (lowering the plate at the inspect pose met the lifted seat / lifting arm in planning).
  - stage: move_to_rest
    speed_class: freespace
    arm: right
    pose_name: rest_pose
    planning_group: rm75_arm_right

  # - stage: hand_release
  #   arm: right
  #   pose_name: release
  #   planning_group: inspire_hand_right

  - stage: move_to_quarter_pole_length
    arm: right
    pose_name: half_length
    planning_group: pole_right

  # - stage: hand_grasp
  #   arm: right
  #   pose_name: half_grasp
  #   planning_group: inspire_hand_right

  - stage: move_to_pre_start
    speed_class: approach
    arm: right
    pose_name: pre_start_pose
    planning_group: rm75_arm_right
    conditional: true
    condition_param: use_prestart_stage

  # Allow collision between hand and commode seat (+ the bowl rim) before taking
  # the hold -- in force before the arm is sent onto the part, as above.
  - stage: allow_collision
    arm: right
    contact_surface: seat_and_body
    additional_ik_frames: [R_glove_frame_2]

  - stage: move_to_start
    speed_class: approach
    arm: right
    pose_name: start_pose
    planning_group: rm75_arm_right

  - stage: hand_release
    arm: right
    pose_name: release
    planning_group: inspire_hand_right

  # ---------------------------------------------------------------------------
  # 6. LEFT arm releases the seat, retracts (to retract_pose), then rests
  # ---------------------------------------------------------------------------
  # One custody transfer, left -> right: the left holds until the right's
  # move_to_start above is done, and releases only here.
  - stage: hand_release
    arm: left
    pose_name: release
    planning_group: inspire_hand_left

  - stage: move_to_retract
    speed_class: approach
    arm: left
    pose_name: retract_pose
    planning_group: rm75_arm_left

  - stage: hand_grasp
    arm: left
    pose_name: grasp
    planning_group: inspire_hand_left

  # Hand has left the seat -> restore normal hand<->seat collision checking.
  - stage: forbid_collision
    arm: left
    contact_surface: seat_and_body
    additional_ik_frames: [L_glove_frame_2]

  - stage: move_to_retract
    speed_class: approach
    arm: left
    pose_name: retract_pose
    planning_group: rm75_arm_left

  - stage: move_to_rest
    speed_class: freespace
    arm: left
    pose_name: rest_pose
    planning_group: rm75_arm_left

  # ---------------------------------------------------------------------------
  # 7. RIGHT arm traces its opening trajectory (-30 -> -110 deg), then rests
  # ---------------------------------------------------------------------------
  - stage: execute_path
    speed_class: carry
    arm: right

  # Seat now fully open -> move only the seat to -110°; lid stays fully open.
  - stage: update_fixture_scene
    seat_angle_deg: -110.0

  - stage: move_to_rest
    speed_class: freespace
    arm: right
    pose_name: rest_pose
    planning_group: rm75_arm_right

  # Forbid collisions between hand and commode after opening
  - stage: forbid_collision
    arm: right
    contact_surface: seat_and_body

  # Trailing hand stage kept from the original, now on the finishing arm: the
  # row ends with the right hand in release (the left re-grasped after its
  # retract, as the right did before).
  - stage: hand_release
    arm: right
    pose_name: release
    planning_group: inspire_hand_right
