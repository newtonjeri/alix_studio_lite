# =============================================================================
# SEAT MECHANISM TASK CONFIGURATION (Open - Compound / Dual-Arm)
# =============================================================================
# This configuration file compounds the left- and right-arm seat-opening
# sequences into a single dual-arm task. Stages execute in order:
#   1. Right arm moves to its inspect pose FIRST, so the wrist camera (the
#      D435 rides on the right wrist) frames the closed seat before anything
#      moves: the baseline frame. The camera does not move again until the
#      check.
#   1b. From the inspect pose the camera confirms the state this plan needs:
#      lid OPEN (else the lid_open plan runs first and this plan restarts) and
#      seat CLOSED (else this plan skips itself: its outcome already holds).
#   2. Left arm grasps and rotates the seat partially open (-30 deg).
#   3. Settle dwell, then the camera CHECK: is the seat lifted (a depth gap
#      between seat and rim, fail-closed)? YES -> continue. NO -> the left arm
#      re-lifts ONCE and the check repeats; a second NO escalates the row to a
#      human. The scene's seat collision object is moved to match (-30 deg)
#      on the YES branch.
#   4. Right arm approaches the partially-open seat (pre-start -> start) and
#      takes the hold.
#   5. Left arm releases, moves to its retract_pose, then returns to rest.
#   6. Right arm traces its trajectory to push the seat fully open; the scene
#      seat is moved to -110 deg, then the right arm returns to rest.
#
# DRAFT 2026-10-05 -- LEFT-first choreography (Newton, 2026-10-05: the left
# lifts, the right checks with its camera and finishes; the seat follows the
# lid). This reverses the 2026-08-16 right-first order of the previous
# revision. Speed classes are UNCHANGED (the C3 table of
# task_parameters_defaults.yaml: approach 0.2 on every pre_start / start /
# retract leg, carry 0.5 on every execute_path, freespace 0.8 on rest and
# inspect moves; start_pose_* scaling 0.5 untouched). Every pose a block did
# not carry before is the base_link Y=0 MIRROR of the other arm's value and is
# UNCALIBRATED -- see the DRAFT markers -- teach + certify before use
# (evidence: Resource/reports/2026-10-05_p20_lift_check/).
#
# Task: Mechanism Manipulation - Seat Opening (Dual-Arm)
# =============================================================================

# =============================================================================
# TASK PARAMETERS
# =============================================================================
task_parameters:
  # Operation Parameters
  # -------------------------------------------------------------------------
  operation: open
  initial_state: SEAT_CLOSED
  final_state: SEAT_OPEN
  mechanism_type: seat
  enable_washroom_scene: true

  # Compound (dual-arm) control
  # -------------------------------------------------------------------------
  # `arms` is the per-arm bundle order (the right primes the compound context,
  # and the first motion stage is the right's inspect move); the stage order
  # itself is stage_sequence below.
  compound: true
  arms: [right, left]

  # scene control
  # -------------------------------------------------------------------------
  commode_fixture_type: lid_open              # Options: closed, lid_open, lid_seat_open


# =============================================================================
# RIGHT ARM   (finishes the opening: takes the hold at -30 deg, pushes to -110)
# =============================================================================
right:
  task_parameters:
    ik_frame: R_tip_frame
    primary_planning_group: rm75_arm_right

  cartesian_poses:
    # 0.65474; -0.15255; 0.46745, -0.24912; 0.93219; 0.058472; 0.25601
    # [0.66474, -0.02855, -0.05855, -0.24912, 0.93219, 0.058472, 0.25601]
    start_pose: [0.66474, -0.02855, -0.05855, -0.24912, 0.93219, 0.058472, 0.25601]
    pre_start_pose: [0.66474, -0.02855, -0.05855, -0.24912, 0.93219, 0.058472, 0.25601]
  
  cleaning_points:
    point1:
      translation: [0.0, 0.0, 0.0]
      rotation: [0.0, 0.0, 0.0]
    point2:
      translation: [0.01, 0.005, 0.03]
      rotation: [0.0, 0.0, 0.0]
    point3:
      translation: [0.02, 0.01, 0.06]
      rotation: [0.0, 0.0, 0.0]
    point4:
      translation: [0.05, 0.01, 0.1]
      rotation: [0.0, -5.0, 0.0]
    point5:
      translation: [0.10, 0.01, 0.125]
      rotation: [0.0, -10.0, 0.0]
    point6:
      translation: [0.175, 0.01, 0.15]
      rotation: [0.0, -12.0, 0.0]
    point7:
      translation: [0.28, 0.01, 0.16]
      rotation: [0.0, -20.0, 0.0]

  # CLEANING SEQUENCE
  # Format: [from, to] - pairs of point names
  # ---------------------------------------------------------------------------
  cleaning_sequence:
    - [point1, point2]
    - [point2, point3]
    - [point3, point4]
    - [point4, point5]
    - [point5, point6]
    - [point6, point7]


# =============================================================================
# LEFT ARM   (lifts the seat: breaks it off 0 deg and holds it at -30)
# =============================================================================
left:
  task_parameters:
    ik_frame: L_glove_frame_3
    primary_planning_group: rm75_arm_left
    
  cartesian_poses:
    start_pose: [0.535, 0.118, -0.11, 0.99669, 0.04812, 0.065393, 0.0032849]
    
    # 0.58456; 0.13676; -0.14306, 0.048186; 0.99669; 0.003265; 0.065462   (RIGHT taught raw, source of the mirror)
    pre_start_pose: [0.58456, 0.11124, -0.14306, 0.99669, 0.048186, 0.065462, 0.003265]   # DRAFT: mirrored from right.pre_start_pose (UNCALIBRATED - teach + certify before use)

    retract_pose:   # DRAFT: mirrored from right.retract_pose (UNCALIBRATED - teach + certify before use)
     translation: [0.20, 0.0, 0.15]   # DRAFT: mirrored from right.retract_pose (UNCALIBRATED - teach + certify before use)
     rotation: [0.0, -15.0, 0.0]      # DRAFT: mirrored from right.retract_pose (UNCALIBRATED - teach + certify before use)

    retract_pose_2:   # DRAFT: mirrored from right.retract_pose (UNCALIBRATED - teach + certify before use)
     translation: [0.20, 0.15, 0.15]
     rotation: [0.0, -15.0, 30.0]

  cleaning_points:
    point1:
      translation: [0.0, 0.0, 0.0]      
      rotation: [0.0, 0.0, 0.0]
    point2:
      translation: [0.0, 0.0, 0.05]
      rotation: [0.0, 2.0, 2.0]         
    point3:
      translation: [0.005, 0.0, 0.1]     
      rotation: [0.0, 5.0, 5.0]         
    point4:
      translation: [0.0175, 0.0, 0.15]    
      rotation: [0.0, 10.0, 7.0]        
    point5:
      translation: [0.04, 0.0, 0.17]  
      rotation: [0.0, 12.0, 10.0]

  # CLEANING SEQUENCE
  # Format: [from, to] - pairs of point names
  # ---------------------------------------------------------------------------
  cleaning_sequence:
    - [point1, point2]
    - [point2, point3]
    - [point3, point4]
    - [point4, point5]


# Pose resolution order (matches single-arm behavior):
#   1. Check joint_space_poses[planning_group][pose_name]
#   2. Check cartesian_poses[pose_name]
#   3. Fall back to SRDF named state (e.g., grasp, open, ready)
# =============================================================================
stage_sequence:
  # Add washroom scene setup stage
  - stage: setup_washroom_scene
    conditional: true
    condition_param: enable_washroom_scene

  - stage: current_state

  # ---------------------------------------------------------------------------
  # 1. RIGHT arm goes to its inspect pose FIRST (baseline frame of the closed seat)
  # ---------------------------------------------------------------------------
  - stage: move_to_inspect_pole_length
    arm: right
    pose_name: half_length
    planning_group: pole_right

  # Fingers CLOSED (grasp) while the camera watches: an open hand dangles its
  # fingertips ~100 mm below the palm, into the path of the rising seat.
  - stage: hand_grasp
    arm: right
    pose_name: grasp
    planning_group: inspire_hand_right

  - stage: move_to_inspect
    speed_class: freespace
    arm: right
    pose_name: inspection_pose_4
    planning_group: rm75_arm_right

  # THE STATE THIS PLAN NEEDS (Newton 2026-10-07, flow). Before the left arm
  # moves, the same camera answers two questions from the inspect pose (each a
  # check_fixture_state pre_action of the next sub-trajectory, fail-closed):
  #   verify_lid_open    the lid must be OPEN (absent from its closed place: the
  #                      centre ROI sees into the bowl). NO -> on_fail
  #                      run_prerequisite: the executive runs the `prerequisite`
  #                      plan (lid_open_<mode>.json beside this one, with its
  #                      own checks and follow-ups) and then restarts THIS plan
  #                      from its first stage, once (max_retries). 2026-10-07:
  #                      this plan was replayed on a closed lid and the left
  #                      pre-start drove into it until the controller aborted.
  #   verify_seat_closed the seat must still be DOWN (the ring at its closed
  #                      height in the front ROI). NO -> on_fail skip: the
  #                      seat is already up, this plan's outcome holds, it ends
  #                      here as done and the arms are parked at its end state.
  - stage: verify_lid_open
    check: fixture_gap
    expect: lid_open
    arm: right
    on_fail: run_prerequisite
    prerequisite: lid_open
    max_retries: 1

  - stage: verify_seat_closed
    check: fixture_gap
    expect: seat_closed
    arm: right
    on_fail: skip

  # ---------------------------------------------------------------------------
  # 2. LEFT arm lifts the seat (partial lift, 0 -> -30 deg)
  # ---------------------------------------------------------------------------
  # (26 Oct: no hand_release here. The executive sets the hand to the half_grasp
  # below before the plan starts; the release then re-grasp cost 2.4 s a run.)
  - stage: move_to_half_pole_length
    arm: left
    pose_name: half_length
    planning_group: pole_left

  - stage: hand_grasp
    arm: left
    pose_name: half_grasp
    planning_group: inspire_hand_left

  - stage: move_to_pre_start
    speed_class: approach
    arm: left
    pose_name: pre_start_pose
    planning_group: rm75_arm_left
    conditional: true
    condition_param: use_prestart_stage

  - stage: allow_collision
    arm: left
    contact_surface: seat_and_body
    additional_ik_frames: [L_glove_frame_2]

  - stage: move_to_start
    speed_class: approach
    arm: left
    pose_name: start_pose
    planning_group: rm75_arm_left

  - stage: execute_path
    speed_class: carry
    arm: left

  # ---------------------------------------------------------------------------
  # 3. Settle, then the camera CHECK (the saved plan is CUT here)
  # ---------------------------------------------------------------------------
  - stage: settle_before_check
    hold_time: 0.5

  - stage: verify_seat_lifted
    check: fixture_gap
    expect: seat_lifted
    arm: right
    on_fail: retry_lift
    max_retries: 1

  # ---------------------------------------------------------------------------
  # 4. Scene: seat -30 deg (the PASS branch)
  # ---------------------------------------------------------------------------
  - stage: update_fixture_scene
    seat_angle_deg: -30.0

  # ---------------------------------------------------------------------------
  # 5. RIGHT arm takes the hold (pre-start -> start on the lifted seat)
  # ---------------------------------------------------------------------------
  # (26 Oct: no move_to_rest here. P20 left the inspect pose through rest because
  # the pole then dropped to quarter length there; the pole stays at half length
  # throughout now, so the right goes from the inspect pose to pre_start, 1.2 s
  # less a run. If the planner refuses the direct path, put the rest back.)
  - stage: move_to_half_pole_length
    arm: right
    pose_name: half_length
    planning_group: pole_right

  - stage: move_to_pre_start
    speed_class: approach
    arm: right
    pose_name: pre_start_pose
    planning_group: rm75_arm_right
    conditional: true
    condition_param: use_prestart_stage

  # Allow collision between hand and commode seat (+ the bowl rim) before taking
  # the hold -- in force before the arm is sent onto the part, as above.
  - stage: allow_collision
    arm: right
    contact_surface: seat_and_body
    additional_ik_frames: [R_glove_frame_2]

  - stage: move_to_start
    speed_class: approach
    arm: right
    pose_name: start_pose
    planning_group: rm75_arm_right

  - stage: hand_release
    arm: right
    pose_name: release
    planning_group: inspire_hand_right

  # ---------------------------------------------------------------------------
  # 6. LEFT arm releases the seat, retracts (to retract_pose), then rests
  # ---------------------------------------------------------------------------
  # One custody transfer, left -> right: the left holds until the right's
  # move_to_start above is done, and releases only here.
  - stage: hand_release
    arm: left
    pose_name: release
    planning_group: inspire_hand_left

  - stage: move_to_retract
    speed_class: approach
    arm: left
    pose_name: retract_pose
    planning_group: rm75_arm_left

  # (26 Oct: no hand_grasp (fist) here. retract_pose_2 and rest are planned with
  # the open hand, 1.9 s less a run and one stream instead of two; the fist was
  # there for the hand<->seat collision checking restored below. If the planner
  # finds the open hand against the seat ring on the way, put the fist back.)
  # Hand has left the seat -> restore normal hand<->seat collision checking.
  - stage: forbid_collision
    arm: left
    contact_surface: seat_and_body
    additional_ik_frames: [L_glove_frame_2]

  - stage: move_to_retract_2
    speed_class: approach
    arm: left
    pose_name: retract_pose_2
    planning_group: rm75_arm_left

  - stage: move_to_rest
    speed_class: freespace
    arm: left
    pose_name: rest_pose
    planning_group: rm75_arm_left

  - stage: hand_release
    arm: left
    pose_name: release
    planning_group: inspire_hand_left

  # ---------------------------------------------------------------------------
  # 7. RIGHT arm traces its opening trajectory (-30 -> -110 deg), then rests
  # ---------------------------------------------------------------------------
  - stage: execute_path
    speed_class: carry
    arm: right

  # Seat now fully open -> move only the seat to -110°; lid stays fully open.
  - stage: update_fixture_scene
    seat_angle_deg: -110.0

  # ---------------------------------------------------------------------------
  # 8. The END-STATE CHECK (Newton 2026-10-26): the right hand in its grasp (the
  #    fist of the first look), the right arm to inspection_pose_1, where the
  #    camera sees the open seat with the lid behind it (from pose 4 it sees
  #    only the seat's lower part: the 12:20 run read "uncertain" five times),
  #    the camera confirms the seat is OPEN (fail-closed; NO -> a person), then
  #    the arm rests. The check rides move_to_rest as its pre_action.
  # ---------------------------------------------------------------------------
  - stage: hand_grasp
    arm: right
    pose_name: grasp
    planning_group: inspire_hand_right

  - stage: move_to_inspect
    speed_class: freespace
    arm: right
    pose_name: inspection_pose_1
    planning_group: rm75_arm_right

  - stage: verify_seat_open
    check: fixture_gap
    expect: seat_open
    arm: right
    on_fail: abort

  - stage: move_to_rest
    speed_class: freespace
    arm: right
    pose_name: rest_pose
    planning_group: rm75_arm_right

  # Forbid collisions between hand and commode after opening
  - stage: forbid_collision
    arm: right
    contact_surface: seat_and_body

  # Trailing hand stage kept from the original, now on the finishing arm: the
  # row ends with the right hand in release (the left re-grasped after its
  # retract, as the right did before).
  - stage: hand_release
    arm: right
    pose_name: release
    planning_group: inspire_hand_right
