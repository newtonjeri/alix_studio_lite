# =============================================================================
# SEAT MECHANISM TASK CONFIGURATION (Open - Compound / Dual-Arm)
# =============================================================================
# This configuration file compounds the left- and right-arm seat-opening
# sequences into a single dual-arm task. Stages execute in order:
#   1. Right arm moves to its inspect pose FIRST, so the wrist camera (the
#      D435 rides on the right wrist) frames the closed seat before anything
#      moves: the baseline frame. The camera does not move again until the
#      check.
#   1b. From the inspect pose the camera confirms the state this plan needs:
#      lid OPEN (else the lid_open plan runs first and this plan restarts) and
#      seat CLOSED (else this plan skips itself: its outcome already holds).
#   2. Left arm grasps and rotates the seat partially open (-30 deg).
#   3. Settle dwell, then the camera CHECK: is the seat lifted (a depth gap
#      between seat and rim, fail-closed)? YES -> continue. NO -> the left arm
#      re-lifts ONCE and the check repeats; a second NO escalates the row to a
#      human. The scene's seat collision object is moved to match (-30 deg)
#      on the YES branch.
#   4. Right arm approaches the partially-open seat (pre-start -> start) and
#      takes the hold.
#   5. Left arm releases, moves to its retract_pose, then returns to rest.
#   6. Right arm traces its trajectory to push the seat fully open; the scene
#      seat is moved to -110 deg, then the right arm returns to rest.
#
# DRAFT 2026-10-05 -- LEFT-first choreography (Newton, 2026-10-05: the left
# lifts, the right checks with its camera and finishes; the seat follows the
# lid). This reverses the 2026-08-16 right-first order of the previous
# revision. Speed classes are UNCHANGED (the C3 table of
# task_parameters_defaults.yaml: approach 0.2 on every pre_start / start /
# retract leg, carry 0.5 on every execute_path, freespace 0.8 on rest and
# inspect moves; start_pose_* scaling 0.5 untouched). Every pose a block did
# not carry before is the base_link Y=0 MIRROR of the other arm's value and is
# UNCALIBRATED -- see the DRAFT markers -- teach + certify before use
# (evidence: Resource/reports/2026-10-05_p20_lift_check/).
#
# Task: Mechanism Manipulation - Seat Opening (Dual-Arm)
# =============================================================================

# =============================================================================
# TASK PARAMETERS
# =============================================================================
task_parameters:
  # Operation Parameters
  # -------------------------------------------------------------------------
  operation: open
  initial_state: SEAT_CLOSED
  final_state: SEAT_OPEN
  mechanism_type: seat
  enable_washroom_scene: true

  # Compound (dual-arm) control
  # -------------------------------------------------------------------------
  # `arms` is the per-arm bundle order (the right primes the compound context,
  # and the first motion stage is the right's inspect move); the stage order
  # itself is stage_sequence below.
  compound: true
  arms: [right, left]

  # scene control
  # -------------------------------------------------------------------------
  commode_fixture_type: lid_open              # Options: closed, lid_open, lid_seat_open


# =============================================================================
# RIGHT ARM   (finishes the opening: takes the hold at -30 deg, pushes to -110)
# =============================================================================
right:
  task_parameters:
    ik_frame: R_glove_frame_3
    primary_planning_group: rm75_arm_right

  # CARTESIAN POSES (Position + Orientation)
  # Format: [x, y, z, qx, qy, qz, qw]
  # ---------------------------------------------------------------------------
  # DRAFT 2026-10-05: no FULL-open pose has been taught for the right arm on
  # commode_c. Every value below is the base_link Y=0 mirror of the LEFT
  # block's former (taught) full-open values: position y' = 0.248 - y in
  # alix_ref_frame, quaternion [qx, qy, qz, qw] -> [qy, qx, qw, qz] (the map
  # the 2026-08-16 lid_close / seat_close pairs obey), path deltas
  # [x, y, z] -> [x, -y, z] and [r, p, y] -> [-r, p, -y]. The mirror is taken
  # from the left's CONFIG values; the raw capture line above each pose is the
  # left's taught capture, kept for provenance exactly as the original did.
  # The RIGHT wrist carries the D435 + camera holder the left does not, so this
  # is the block a mirror is most likely to get wrong (camera clearance):
  # IK/collision PROBE ONLY -> MUST BE TAUGHT on the robot before any
  # hardware run.
  cartesian_poses:
    # 0.51541; -0.014256; 0.026096, -0.20138; 0.93128; 0.12737; 0.27557
    start_pose: [0.51541, -0.014256, 0.026096, -0.20138, 0.93128, 0.12737, 0.27557]

    # source left.pre_start_pose: [0.59, 0.33, 0.0, 0.70011, 0.71386, 0.0025908, -0.015498]   (no raw capture recorded)
    # pre_start_pose: [0.59, -0.082, 0.0, 0.713861, 0.700111, -0.015498, 0.002591] 

    pre_start_pose: [0.51541, -0.014256, 0.026096, -0.20138, 0.93128, 0.12737, 0.27557]   # DRAFT: mirrored from left.pre_start_pose (UNCALIBRATED - teach + certify before use)


  # CLEANING POINTS (Translation [x,y,z] + Rotation [r,p,y])
  # Translation: [x, y, z] in meters
  # Rotation: [roll, pitch, yaw] in degrees
  # Relative to vector_frame_id (alix_ref_frame)
  # ---------------------------------------------------------------------------
  # Full-open arc from the seat already lifted to -30 deg (knot 0 = start_pose).
