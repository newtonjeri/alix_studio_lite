  # cleaning_points:
  #   point1:
  #     translation: [0.0, 0.0, 0.0]      # DRAFT: mirrored from left.cleaning_points.point1 (UNCALIBRATED - teach + certify before use)
  #     rotation: [0.0, 0.0, -10.0]       # DRAFT: mirrored from left.cleaning_points.point1 (UNCALIBRATED - teach + certify before use)
  #   point2:
  #     translation: [0.02, 0.01, 0.03]    # DRAFT: mirrored from left.cleaning_points.point2 (UNCALIBRATED - teach + certify before use)
  #     rotation: [0.0, -5.0, -15.0]      # DRAFT: mirrored from left.cleaning_points.point2 (UNCALIBRATED - teach + certify before use)
  #   point3:
  #     translation: [0.035, 0.02, 0.06]   # DRAFT: mirrored from left.cleaning_points.point3 (UNCALIBRATED - teach + certify before use)
  #     rotation: [0.0, -15.0, -10.0]     # DRAFT: mirrored from left.cleaning_points.point3 (UNCALIBRATED - teach + certify before use)
  #   point4:
  #     translation: [0.095, 0.03, 0.1]    # DRAFT: mirrored from left.cleaning_points.point4 (UNCALIBRATED - teach + certify before use)
  #     rotation: [0.0, -20.0, -8.0]      # DRAFT: mirrored from left.cleaning_points.point4 (UNCALIBRATED - teach + certify before use)
  #   point5:
  #     translation: [0.17, 0.035, 0.15]    # DRAFT: mirrored from left.cleaning_points.point5 (UNCALIBRATED - teach + certify before use)
  #     rotation: [0.0, -30.0, -4.0]      # DRAFT: mirrored from left.cleaning_points.point5 (UNCALIBRATED - teach + certify before use)
  #   point6:
  #     translation: [0.24, 0.04, 0.21]    # DRAFT: mirrored from left.cleaning_points.point6 (UNCALIBRATED - teach + certify before use)
