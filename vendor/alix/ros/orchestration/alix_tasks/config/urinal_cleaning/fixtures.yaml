# =============================================================================
# Urinal fixture registry
# =============================================================================
# default   → fixture_id used when urinal_fixture_id is not passed at launch.
# fixtures  → known variants; keys MUST match subfolder names under
#             config/urinal_cleaning/.
#
# To add a new variant:
#   1. Create config/urinal_cleaning/<new_id>/ with scene.yaml + cleaning configs.
#   2. Add an entry below.  No launch file or C++ changes needed.
# =============================================================================

default: urinal_a

fixtures:
  urinal_a:
    display_name: "Urinal A (SG)"
    articulated: false
