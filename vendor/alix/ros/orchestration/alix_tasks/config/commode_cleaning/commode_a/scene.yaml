# =============================================================================
# FIXTURE MODEL: commode_a  (Karcher — pre-baked whole-commode meshes)
# =============================================================================
# Geometry and articulation data for this fixture model.
#
# pose             → default position of this fixture relative to base_link.
#                    The venue's washroom_scene.yaml commode_slot.position
#                    overrides this at runtime; this value is the fallback
#                    used when no venue file is loaded (standalone testing).
#
# articulated: false  → WashroomSceneBuilder is used (pre-baked per-state meshes)
# articulated: true   → ArticulatedSceneBuilder is used (separate body/lid/seat)
# =============================================================================

fixture:
  display_name: "Commode A (Karcher SG)"
  type: "commode"
  articulated: false
  # Commode part classification (Newton, 2026-08-18) — orthogonal to
  # `articulated`: which openable parts this commode HAS. One of
  # has_lid_only | has_seat_only | has_lid_and_seat. Every commode in the
  # current fleet (a-c) has both. Consumers: mechanism-task invocation
  # (which lid/seat open/close tasks exist for this fixture), the cleaning
  # generator's reality-logic validator (a region requiring seat states is
  # impossible on has_lid_only), and the future perception package's
  # inspection stages.
  commode_classification: "has_lid_and_seat"

  # AUTHORITATIVE position used at runtime (calibrated per-fixture).
  # The venue washroom_scene.yaml commode_slot.position is only used as a
  # fallback if this block is absent (i.e. when the fixture is not yet calibrated).
  #
  # PLACEMENT (measured 2026-08-15): the state meshes' origin is at the
  # FRONT (x spans [-0.001, +0.710]) with the CISTERN at the max_x end — the
  # mesh faces LOCAL -X, opposite of commode_c. The venue yaw (180) alone
  # therefore turned its front AWAY from the robot; the fixture's own yaw 180
  # composes to identity so the bowl faces the UGV, and the front tip lands
  # at x = 0.225 + 0.250 = 0.475 + |min_x|. z = mesh bottom on the floor.
  # Uncalibrated bring-up value — calibrate in place like commode_c.
  pose:
    relative_to: "base_link"
    position: [0.4764, 0.0, 0.4171]
    orientation_rpy_deg: [0.0, 0.0, 180.0]
    default_ugv_standoff_m: 0.25

  # Pre-baked meshes — one STL per fixture state.
  # Paths use package:// URI resolved at runtime.
  meshes:
    closed:       "package://alix_tasks/config/commode_cleaning/commode_a/models/closed.stl"
    lid_open:     "package://alix_tasks/config/commode_cleaning/commode_a/models/lid_open.stl"
    lid_seat_open: "package://alix_tasks/config/commode_cleaning/commode_a/models/lid_seat_open.stl"

  scale: [0.001, 0.001, 0.001]   # Scale factor to apply to the meshes (if needed)
