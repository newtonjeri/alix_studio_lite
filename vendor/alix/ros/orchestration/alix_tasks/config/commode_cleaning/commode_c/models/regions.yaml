    path_topology: ring   # bowl-rim annulus — arc strokes, no chords (G50)
    # Measured reachable-coverage ceiling (G50): with the ring planner the
    # rim reach-solves FULLY (45/45 R, 27/27 L — historically its transit
    # fraction was the corpus's worst) but the rim's outer/inner roll-off
    # caps swept coverage at ~89-94% per arm. Same principle as the crease
    # families' 90 (Newton, 2026-08-17). FLAGGED for Newton's review.
    coverage_pass_pct: 90
