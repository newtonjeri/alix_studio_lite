  hinge_area:
    region_id: 13
    component: body
    # MERGED task (Newton, 2026-08-18 — G50, matching the archived corpus):
    # hinge_area combines the lid's back-side strip (former lidsides_back,
    # cleaned first) with the body hinge area — the archived
    # hinge_area_*_cleaning_points.yaml is exactly this merge (27 points,
    # merge math in its header). lidsides_back generates nothing on its own.
    groups:
    - hinge_area
    - component: lid
      name: lidsides_back
    arm_coverage: RL_paired
    # Overlap into the other half (2026-08-18, G48): the hinge
    # strips are NARROW bands across the midline; under
    # paired_strict_half each arm's waypoints stop at Y=0 while
    # coverage is measured against the WHOLE region, capping the
    # per-arm score at ~50-80% (measured) regardless of reach.
    # Both arms physically reach past this strip's middle.
    arm_overlap: true
    description: Hinge area (body)
    # Crease region (lid-body hinge line). Newton, 2026-08-17: "do not be too
    # strict" — 90% coverage is the pass target here; the last strip lives in
    # the crease the glove cannot enter.
    coverage_pass_pct: 90
    # Declared residual contact (G50 depth audit on the MERGED task): the
    # back-strip portion wraps the hand under the closed lid's rear edge and
    # off-set links BRUSH it — every depth within the 20 mm pad compliance
    # (comment = min/max penetration over attempted branches, hits).
    extra_collisions:
    - [IRH_right_thumb_tip, commode_lid]   # 0.0-0.9 mm, x9 (G50)
    - [IRH_right_thumb_4, commode_lid]   # 0.1-2.6 mm, x8 (G50)
