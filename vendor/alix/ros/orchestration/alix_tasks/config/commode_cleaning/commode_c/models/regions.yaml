# =============================================================================
# MESH-LEVEL REGION ANNOTATIONS (commode_c) — SINGLE SOURCE OF TRUTH
# =============================================================================
# This manifest is the authoritative registry for region metadata. The
# orchestrator's regions_commode.csv is DERIVED from it (the studio server
# syncs it on save); edit regions here, not in the CSV.
#
# Labeled mesh convention:
#   - One OBJ per component, same local frame and units (metres) as the
#     component STL (body.stl / lid.stl / seat.stl).
#   - One OBJ object per region group:  `o <group_name>`  (Blender: split by
#     selection, name the objects; numeric suffixes like `.001` are stripped).
#   - Authored once, revisable any time in Blender/MeshLab or with the web
#     editor's Paint mode (export from the Region Labels panel).
#
# Region entries:
#   groups              ordered list of labeled groups; >1 group = compound
#                       region (planned per group, chained into one task).
#                       Each entry is a bare group name (lives in this
#                       region's `component` OBJ) or {component, name} for a
#                       group in a NEIGHBOURING component's OBJ — one region
#                       may span multiple components (e.g. body + seat).
#   component           primary component (default body); per-group override
#                       via the {component, name} group form
#   arm_coverage        R | L | RL_paired | RL_compound
#   region_id           stable orchestrator id (schedules reference these);
#                       assigned automatically by the studio when omitted
#   articulation_state  static | open | closed — articulated-component pose
#                       the region is cleaned in (default: closed for
#                       lid/seat, static for body)
#   lid_state/seat_state  open | closed — explicit full-fixture articulation
#                       while this region is cleaned, editable from the studio
#                       Generate tab. Overrides the component-derived guess and
#                       drives commode_fixture_type (closed / lid_open /
#                       lid_seat_open). Use for regions whose required state
#                       the components can't express, e.g. a hinge region
#                       spanning seat+lid cleaned with the lid open and the
#                       seat down, or a body region needing the lid open.
#                       Reality logic is enforced: seat_state open forces
#                       lid_state open (the seat swings up against the lid).
#   requires_lid/seat   optional overrides; default: derived from components
#                       plus any explicit open lid_state/seat_state
#   ugv_standoff_m      authoring default UGV standoff (METRES, e.g. 0.38) the
#                       region's tasks are generated at; absent = fleet default
#                       0.25. Stamped into each generated config's
#                       task_parameters.ugv_standoff_m (the executable record
#                       the runtime scene + orchestrator repositioning read).
#                       Changing it does NOT retroactively update existing
#                       configs/plans — regenerate them.
#   surface_type        optional planner override (planar | near_planar |
#                       single_curved | double_curved | concave_interior | annular)
#   spacing_m           optional row-spacing override
#   generate            false = NO task config for this region (Newton,
#                       2026-08-18 — G50 corpus ruling): its coverage belongs
#                       to a covering task (deep -> bowl tasks; lidsides_back
#                       -> hinge_area; the side/front strips -> lid_side /
#                       lid_seat_front). The mesh group stays referenceable
#                       by the covering task's `groups:`.
#   path_topology       "ring" = the surface is an annulus (seat_ring, bowl
#                       rim/ring families). The path is generated as arc
#                       strokes around the ring — NO segment may chord the
#                       central void; every segment lies ON the part
#                       (Newton, 2026-08-18 — G50).
#   extra_collisions    declared residual-contact pairs ([link, object] lists)
#                       for this region (Newton, 2026-08-18 — G40): where the
#                       region's geometry forces an OFF-SET hand link to brush
#                       the surface being pressed (curved/rim/interior
#                       families wrapping the hand), the pair is declared HERE
#                       and the generator emits it into the config's
#                       allow/forbid `collisions:` lists (the per-task C++
#                       escape hatch). Declare both arms' pairs; each config
#                       takes only its own side's. Licensed for BRUSHING only:
#                       the reach gate measures every declared pair's
#                       penetration at the accepted poses and fails the config
#                       beyond the 20 mm pad compliance. Pairs are MEASURED
#                       (audit: depth envelope per blocking pair, G40), never
#                       curated, and never a way to re-widen the global
#                       contact_links.yaml sets.
#
# Mechanism pseudo-regions (lid_open, seat_open, lid_close) are not mesh
# regions; they live only in the orchestrator CSV.
# =============================================================================

