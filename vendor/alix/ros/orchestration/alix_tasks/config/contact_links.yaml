# =============================================================================
# CONTACT LINK GROUPS + CONTACT SURFACE OBJECTS
# =============================================================================
# contact_link_groups[ik_frame] x contact_surface_objects[contact_surface]
#   -> the collision pairs an allow_collision / forbid_collision stage toggles.
#
# THE GLOVE-FRAME GROUPS, AND THE COMMENT ABOVE EACH ONE, ARE DERIVED FROM
# GEOMETRY. DO NOT EDIT THEM.
#   regenerate:   python3 tools/regen_contact_links.py --write
#   check drift:  python3 tools/regen_contact_links.py --check
#   pinned by:    core/python/alix_taskgen/test_generate/test_contact_links_derived.py
#
# THE RULE
#   * a FINGER link is in the group when its geometry comes within the pad's own
#     20 mm band (thickness_m) of the frame-origin contact plane;
#   * five digits, no exceptions - index, middle, ring, little AND thumb
#     (Newton, 2026-09-04, ruled twice and settled);
#   * a finger's RUBBER follows the segment it is bonded to. Every *_rubber_* is
#     a FIXED child of one finger link in the hand urdf, so it is that segment's
#     contact face: the porcelain meets the rubber first, and admitting the rigid
#     segment while excluding its rubber is backwards (Newton, 2026-09-16);
#   * NON-FINGER links are out of the PLANE RULE - plam, palm_rubber_1, base_link -
#     even where they lie on the plane. palm_rubber_1's parent is the palm, so
#     the rubber rule does not readmit it;
#   * PLUS NEWTON'S RULING OF 2026-09-22, on the executed hardware runs
#     (tools/calibrate_oracle_on_hardware.py): "keep fingers-only but add the
#     palm for the palm-pad frames and the thumb for frame 3" - the palm shell
#     and its rubber join glove_frame_1 and glove_frame_2 (the pad IS the palm
#     there: frame_2 executed with the palm in the body on 42-61 % of samples at
#     2-4 mm median penetration) and every thumb link joins glove_frame_3 (rim
#     tasks executed with thumb_2/3/4 in the body on 30 % of samples).  Written
#     as a named addition above the plane-derived list, never mixed into it;
#   * no lateral footprint window. The band governs CONTACT (what may touch the
#     porcelain), the footprint governs COVERAGE (what counts as wiped), and this
#     file governs contact.
#
# NOT DERIVED, authored: L/R_tip_frame (no pad in glove_frames.yaml, so the rule
# has no contact plane to stand on) and L/R_bin_grip_fingers (a grip set, not a
# pressed pad). This tool never writes them.
#
# Full derivation, distance tables, stability analysis and blast radius:
#   Resource/reports/2026-09-04_contact_link_derivation/final_rule.md
# =============================================================================

