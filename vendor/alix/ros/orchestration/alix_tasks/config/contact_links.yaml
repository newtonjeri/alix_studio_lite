# =============================================================================
# CONTACT SURFACE OBJECTS
# Values are lists of URDF collision object names in the planning scene.
# =============================================================================
contact_surface_objects:

  # The glove wearing unit (2026-08-19, C11): named so glove-task
  # allow/forbid brackets can carry a valid contact_surface. Tip frames
  # have no contact_link_groups entry, so auto-resolution stays empty and
  # ONLY the brackets' explicit `collisions:` pairs act — the narrow
  # wear-insertion window, not a wholesale hand allowance.
  glove_unit:
    # - glove_wearing_unit_arm
    - glove_wearing_unit_base
  # Toilet seat only (ring / seat tasks)
  seat:
    - commode_seat

  # Lid only (toplid tasks)
  lid:
    - commode_lid

  # Outer body / side panels
  body:
    - commode_body

  # Seat ring + lid (bottomlid, seat_ring tasks — hand contacts both surfaces)
  seat_and_lid:
    - commode_seat
    - commode_lid

  # Seat ring + body (seat_body tasks — hand contacts both surfaces)
  seat_and_body:
    - commode_seat
    - commode_body

  # All three surfaces (side tasks — hand sweeps across seat, lid, and body)
  all:
    - commode_seat
    - commode_lid
    - commode_body

  # Bin HANDLES only (Newton, 2026-08-18): the carry tasks (extend/lower,
  # raise/retract) grip the handles — the bin BODY and the opening covers are
  # never legitimate contact during a carry, and the old group (bin body +
  # handles + both covers) allowed all of them. Glove-removal contact goes
  # through `bin_lid_covers` below; the key keeps its historic name because
  # every bin task config references it.
  bin_handle_right:
    - bin_handle_right
  bin_handle_left:
    - bin_handle_left

  # Bin top covers alone — allow_collision target for glove_remove stages
  # (hand pushes the used glove through the 21 mm centre slot).
  bin_lid_covers:
    - lid_opening_cover1
    - lid_opening_cover2

